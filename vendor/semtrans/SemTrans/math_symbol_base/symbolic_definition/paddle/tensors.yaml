  math_symbol: "StridedSlice(X, starts, ends, strides)"
  param_map:
    starts: starts
    ends: ends
    strides: strides

Transpose:
  definition_type: operator
  description: "Paddle transpose permutes tensor dimensions according to perm."
  math_symbol: "Transpose(X, perm)"
  param_map:
    perm: perm

Squeeze: &PaddleSqueeze
  definition_type: operator
  description: "Paddle squeeze removes singleton dimensions, or the selected singleton axis/axes."
  math_symbol: "Squeeze(X, axis)"
  param_map:
    axis: axis
  default_values:
