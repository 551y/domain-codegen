Clip:
  definition_type: operator
  description: "Paddle clip with tensor or scalar bounds."
  math_symbol: "Clip(X, min_value, max_value)"
  param_map:
    min_value: min_value
    max_value: max_value

Cumsum:
  definition_type: operator
  description: "Paddle cumulative sum along a configured axis."
  math_symbol: "Cumsum(X, axis)"
  param_map:
    axis: axis

Sum:
  definition_type: operator
  description: "Paddle reduction sum with explicit axis and keepdim."
  math_symbol: "ReduceSum(X, axis, keepdim)"
  param_map:
    axis: axis
    keepdim: keepdim

# ==============================================================================
# Paddle Matrix Multiplication (With Transpose Attributes)
# ==============================================================================
Matmul:
  definition_type: operator
  description: "Paddle Matmul"
  derived_variables:
    A: Piecewise((Transpose(X1, make_swap_perm(Rank(X1), -1, -2)), trans_x), (X1, True))
    B: Piecewise((Transpose(X2, make_swap_perm(Rank(X2), -1, -2)), trans_y), (X2, True))
  math_symbol: >
    Piecewise(
      (Sum(A[n, c, h, k] * B[n, c, k, w], (k, 0, Dim(A, -1) - 1)), (Rank(A) == 4) & (Rank(B) == 4)),
      (Sum(A[n, h, k] * B[n, k, w], (k, 0, Dim(A, -1) - 1)), (Rank(A) == 3) & (Rank(B) == 3)),
      (Sum(A[n, h, k] * B[k, w], (k, 0, Dim(A, -1) - 1)), (Rank(A) == 3) & (Rank(B) == 2)),
      (Sum(A[h, k] * B[k, w], (k, 0, Dim(A, -1) - 1)), (Rank(A) == 2) & (Rank(B) == 2)),
      (MatMul(A, B), True)
    )
  param_map:
    x: "X1"
    y: "X2"
    transpose_x: "trans_x"
    transpose_y: "trans_y"
  mechanisms:
    - description: "Inner Dimension Alignment"
      check: "Dim(A, -1) == Dim(B, -2)"

