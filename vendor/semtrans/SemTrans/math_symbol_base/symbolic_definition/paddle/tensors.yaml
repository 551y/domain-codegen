  description: "Paddle mean reduces one or more axes and optionally preserves reduced dimensions."
  math_symbol: "ReduceMean(X, axis, keepdim)"
  param_map:
    axis: axis
    keepdim: keepdim
  default_values:
    axis: all
    keepdim: false

mean: *PaddleMean

Add:
  definition_type: operator
  description: "Paddle Add"
  math_symbol: "X1 + X2"
  param_map:
    x: "X1"
    y: "X2"

Subtract:
  definition_type: operator
  description: "Paddle Subtract"
  math_symbol: "X1 - X2"
  param_map:
    x: "X1"
    y: "X2"

Multiply:
  definition_type: operator
  description: "Paddle Multiply"
  math_symbol: "X1 * X2"
  param_map:
    x: "X1"
    y: "X2"

Divide:
  definition_type: operator
  description: "Paddle Divide"
  math_symbol: "X1 / X2"
  param_map:
    x: "X1"
    y: "X2"

Rsqrt:
  definition_type: operator
  description: "TFLite reciprocal square root"
  math_symbol: "1 / Sqrt(X)"
  output_shape:
    - "Shape(X)"

Pad:
  definition_type: operator
  description: "TFLite explicit padding with a constant value"
  math_symbol: "Pad(X, paddings, value)"
  param_map:
    paddings: paddings
    value: value

Interpolate:
  definition_type: operator
  description: "Paddle 2D interpolation with explicit coordinate and layout semantics."
  math_symbol: "Resize2D(X, scale_factor, mode, align_corners, align_mode, data_format)"
  param_map:
