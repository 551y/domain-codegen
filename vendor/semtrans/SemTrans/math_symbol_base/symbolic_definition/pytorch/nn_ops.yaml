    - description: "Non-negative padding constraint"
      check: >
        (pad_l >= 0) & (pad_r >= 0) &
        (pad_t >= 0) & (pad_b >= 0)

ConstantPad3d:
  description: "Pads the input tensor boundaries with a constant value."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (pad_val, (d - pad_f) < 0),
      (pad_val, (d - pad_f) >= Dim(X, 2)),
      (pad_val, (h - pad_t) < 0),
      (pad_val, (h - pad_t) >= Dim(X, 3)),
      (pad_val, (w - pad_l) < 0),
      (pad_val, (w - pad_l) >= Dim(X, 4)),
      (X[n, c, d - pad_f, h - pad_t, w - pad_l], True)
    )
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b", "pad_f", "pad_bk" ]
