ZeroPad1d:
  description: "Pads the input tensor boundaries with zero."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0, (w - pad_l) < 0),
      (0, (w - pad_l) >= Dim(X, 2)),
      (X[n, c, w - pad_l], True)
    )
  param_map:
    padding: [ "pad_l", "pad_r" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_l + pad_r
  mechanisms:
    - description: "Output shape definition"
      check: "Dim(Y, 2) == Dim(X, 2) + pad_l + pad_r"
    - description: "Non-negative padding constraint"
      check: "(pad_l >= 0) & (pad_r >= 0)"

ZeroPad2d:
  description: "Pads the input tensor boundaries with zero."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0, (h - pad_t) < 0),
      (0, (h - pad_t) >= Dim(X, 2)),
      (0, (w - pad_l) < 0),
      (0, (w - pad_l) >= Dim(X, 3)),
      (X[n, c, h - pad_t, w - pad_l], True)
    )
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b" ]
  output_shape:
