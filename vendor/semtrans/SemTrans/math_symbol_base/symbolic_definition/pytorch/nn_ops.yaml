        (Dim(Y, 2) == Dim(X, 2) + pad_t + pad_b) &
        (Dim(Y, 3) == Dim(X, 3) + pad_l + pad_r)
    - description: "Output dimension constraint"
      check: >
        (Dim(X, 2) + pad_t + pad_b > 0) &
        (Dim(X, 3) + pad_l + pad_r > 0)

ReplicationPad3d:
  description: "Pads the input tensor using replication."
  definition_type: operator
  math_symbol: >
    X[n, c,
      Piecewise(
        (0, (d - pad_f) < 0),
        (Dim(X, 2) - 1, (d - pad_f) >= Dim(X, 2)),
        (d - pad_f, True)
      ),
      Piecewise(
        (0, (h - pad_t) < 0),
        (Dim(X, 3) - 1, (h - pad_t) >= Dim(X, 3)),
        (h - pad_t, True)
      ),
      Piecewise(
        (0, (w - pad_l) < 0),
        (Dim(X, 4) - 1, (w - pad_l) >= Dim(X, 4)),
