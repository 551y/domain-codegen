        (Dim(Y, 3) == Dim(X, 3) + pad_t + pad_b) &
        (Dim(Y, 4) == Dim(X, 4) + pad_l + pad_r)
    - description: "Non-negative padding constraint"
      check: >
        (pad_l >= 0) & (pad_r >= 0) &
        (pad_t >= 0) & (pad_b >= 0) &
        (pad_f >= 0) & (pad_bk >= 0)

CircularPad1d:
  description: "Pads the input tensor using circular wrapping (modulo)."
  definition_type: operator
  math_symbol: >
    X[n, c, Mod(w - pad_l, Dim(X, 2))]
  param_map:
    padding: [ "pad_l", "pad_r" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_l + pad_r
  mechanisms:
    - description: "Output shape definition"
      check: "Dim(Y, 2) == Dim(X, 2) + pad_l + pad_r"
    - description: "Padding size constraint (must be less than input dim)"
      check: "(pad_l < Dim(X, 2)) & (pad_r < Dim(X, 2))"
    - description: "Non-negative padding constraint"
      check: "(pad_l >= 0) & (pad_r >= 0)"

CircularPad2d:
  description: "Pads the input tensor using circular wrapping (modulo)."
  definition_type: operator
  math_symbol: >
    X[n, c, 
      Mod(h - pad_t, Dim(X, 2)), 
      Mod(w - pad_l, Dim(X, 3))
    ]
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_t + pad_b
    - Dim(X, 3) + pad_l + pad_r
  mechanisms:
    - description: "Padding size constraint (must be less than input dim)"
      check: >
        (pad_l < Dim(X, 3)) & (pad_r < Dim(X, 3)) &
        (pad_t < Dim(X, 2)) & (pad_b < Dim(X, 2))

CircularPad3d:
  description: "Pads the input tensor using circular wrapping (modulo)."
  definition_type: operator
  math_symbol: >
    X[n, c, 
      Mod(d - pad_f, Dim(X, 2)),
      Mod(h - pad_t, Dim(X, 3)), 
      Mod(w - pad_l, Dim(X, 4))
    ]
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b", "pad_f", "pad_bk" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_f + pad_bk
    - Dim(X, 3) + pad_t + pad_b
    - Dim(X, 4) + pad_l + pad_r
  mechanisms:
    - description: "Padding size constraint (must be less than input dim)"
      check: >
        (pad_l < Dim(X, 4)) & (pad_r < Dim(X, 4)) &
        (pad_t < Dim(X, 3)) & (pad_b < Dim(X, 3)) &
        (pad_f < Dim(X, 2)) & (pad_bk < Dim(X, 2))

ELU:
  description: "Applies the Exponential Linear Unit (ELU) function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (X, X > 0),
      (alpha * (exp(X) - 1), True)
    )
  param_map:
    alpha: "alpha"
  mechanisms:
    - description: "Rank preservation check"
      check: "Rank(Y) == Rank(X)"
    - description: "Shape preservation check"
      check: "Shape(Y) == Shape(X)"

Hardshrink:
  description: "Applies the hard shrinkage function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (X, X > alpha),
      (X, X < -alpha),
      (0, True)
    )
  param_map:
    lambd: "alpha"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"
    - description: "Non-negative threshold"
      check: "alpha >= 0"

Hardsigmoid:
  description: "Applies the Hardsigmoid function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0, X <= -3),
      (1, X >= 3),
      (X / 6 + 0.5, True)
    )
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

Hardtanh:
  description: "Applies the HardTanh function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (max_val, X > max_val),
      (min_val, X < min_val),
      (X, True)
    )
  param_map:
    min_val: "min_val"
    max_val: "max_val"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"
    - description: "Bound consistency"
      check: "min_val <= max_val"

Hardswish:
  description: "Applies the Hardswish function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0, X <= -3),
      (X, X >= 3),
      (X * (X + 3) / 6, True)
    )
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

LeakyReLU:
  description: "Applies the Leaky ReLU function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (X, X >= 0),
      (alpha * X, True)
    )
  param_map:
    negative_slope: "alpha"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

LogSigmoid:
  description: "Applies the element-wise function: LogSigmoid(x) = log(1 / (1 + exp(-x)))."
  definition_type: operator
  math_symbol: >
    Log(1 / (1 + Exp(-X)))
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

ReLU:
  description: "Applies the rectified linear unit function element-wise."
  definition_type: operator
  math_symbol: >
    Piecewise((X, X >= 0), (0, True))
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

Sigmoid:
  description: "Standard Sigmoid: 1 / (1 + exp(-x))"
  definition_type: operator
  math_symbol: "1 / (1 + Exp(-X))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

SiLU:
  description: "SiLU/Swish: x * sigmoid(x)"
  definition_type: operator
  math_symbol: "X * (1 / (1 + Exp(-X)))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

Mish:
  description: "Mish: x * tanh(softplus(x))"
  definition_type: operator


  math_symbol: >
    X * ((Exp(Log(1 + Exp(X))) - Exp(-Log(1 + Exp(X)))) / 
         (Exp(Log(1 + Exp(X))) + Exp(-Log(1 + Exp(X)))))
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Tanh:
  description: "Standard Tanh Expanded"
  definition_type: operator
  math_symbol: "(Exp(X) - Exp(-X)) / (Exp(X) + Exp(-X))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Tanhshrink:
  description: "x - tanh(x) Expanded"
  definition_type: operator
  math_symbol: "X - ((Exp(X) - Exp(-X)) / (Exp(X) + Exp(-X)))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Softsign:
  description: "x / (1 + |x|)"
  definition_type: operator
  math_symbol: "X / (1 + Abs(X))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

ReLU6:
  description: "Clamped ReLU: min(max(0, x), 6)"
  definition_type: operator
  math_symbol: "Piecewise((6, X > 6), (0, X < 0), (X, True))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

SELU:
  description: "Scaled Exponential Linear Unit"
  definition_type: operator
  math_symbol: "1.0507009873554805 * Piecewise((X, X > 0), (1.6732632423543772 * (Exp(X) - 1), True))"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

PReLU:
  description: "Parametric ReLU with support for Shared (1) and Per-channel (C) weights."
  definition_type: operator
  math_symbol: >
    Piecewise(
      # Rank 4 (NCHW)
      (Y[n, c, h, w] == Piecewise(
        (X[n, c, h, w], X[n, c, h, w] >= 0), 
        (Piecewise((W[0] * X[n, c, h, w], Eq(num_parameters, 1)), (W[c] * X[n, c, h, w], True)), True)
      ), Rank(X) == 4),
      
      # Rank 2 (NC)
      (Y[n, c] == Piecewise(
        (X[n, c], X[n, c] >= 0), 
        (Piecewise((W[0] * X[n, c], Eq(num_parameters, 1)), (W[c] * X[n, c], True)), True)
      ), Rank(X) == 2),
      
      # Rank 3 (NCL)
      (Y[n, c, l] == Piecewise(
        (X[n, c, l], X[n, c, l] >= 0), 
        (Piecewise((W[0] * X[n, c, l], Eq(num_parameters, 1)), (W[c] * X[n, c, l], True)), True)
      ), Rank(X) == 3),

      # Rank 5 (NCDHW)
      (Y[n, c, d, h, w] == Piecewise(
        (X[n, c, d, h, w], X[n, c, d, h, w] >= 0), 
        (Piecewise((W[0] * X[n, c, d, h, w], Eq(num_parameters, 1)), (W[c] * X[n, c, d, h, w], True)), True)
      ), Rank(X) == 5)
    )
  param_map:
    num_parameters: "num_parameters"
  mechanisms:
    - description: "Parameter dimension constraint"
      check: "(Eq(num_parameters, 1)) | (Eq(num_parameters, Dim(X, 1)))"

RReLU:
  description: "Randomized Leaky ReLU (Eval mode)"
  definition_type: operator
  math_symbol: "Piecewise((X, X >= 0), (X * (min_val + max_val) / 2, True))"
  param_map:
    lower: "min_val"
    upper: "max_val"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

CELU:
  description: "Continuously Differentiable ELU"
  definition_type: operator
  math_symbol: "Piecewise((X, X >= 0), (alpha * (Exp(X / alpha) - 1), True))"
  param_map:
    alpha: "alpha"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"
    - description: "Alpha constraint"
      check: "alpha != 0"

GELU:
  description: "Gaussian Error Linear Units (Expanded Tanh)"
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0.5 * X * (1 + Erf(X / Sqrt(2))), Eq(approximate, 'none')),
      (0.5 * X * (1 + (Exp(Sqrt(2/Pi) * (X + 0.044715 * X**3)) - Exp(-Sqrt(2/Pi) * (X + 0.044715 * X**3))) / 
                    (Exp(Sqrt(2/Pi) * (X + 0.044715 * X**3)) + Exp(-Sqrt(2/Pi) * (X + 0.044715 * X**3)))), Eq(approximate, 'tanh'))
    )
  param_map:
    approximate: "approximate"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Softplus:
  definition_type: operator
  math_symbol: "Piecewise((X, (alpha * X) > max_val), (1/alpha * Log(1 + Exp(alpha * X)), True))"
  param_map:
    beta: "alpha"
    threshold: "max_val"
  mechanisms:
    - description: "Non-zero alpha"
      check: "alpha != 0"

Softshrink:
  definition_type: operator
  math_symbol: "Piecewise((X - alpha, X > alpha), (X + alpha, X < -alpha), (0, True))"
  param_map:
    lambd: "alpha"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"
    - description: "Non-negative alpha"
      check: "alpha >= 0"

Threshold:
  definition_type: operator
  math_symbol: "Piecewise((X, X > min_val), (alpha, True))"
  param_map:
    threshold: "min_val"
    value: "alpha"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Y) == Shape(X)"

GLU:
  description: "Gated Linear Unit. Standardized Coordinate System (n, c, d, h, w)."
  math_symbol: >
    Piecewise(
      (
        X[n, c, d, h, w] * (1 / (1 + Exp(-X[n, c + Dim(X, 1)/2, d, h, w]))),
        (Rank(X) == 5) & ((dim == 1) | (dim == -4))
      ),
      (
        X[n, c, h, w] * (1 / (1 + Exp(-X[n, c + Dim(X, 1)/2, h, w]))),
        (Rank(X) == 4) & ((dim == 1) | (dim == -3))
      ),
      (
        X[n, c, l] * (1 / (1 + Exp(-X[n, c + Dim(X, 1)/2, l]))),
        (Rank(X) == 3) & ((dim == 1) | (dim == -2))
      ),
      (
        X[n, c] * (1 / (1 + Exp(-X[n, c + Dim(X, 1)/2]))),
        (Rank(X) == 2) & ((dim == 1) | (dim == -1))
      ),
      (
        X[n, c, d, h, w] * (1 / (1 + Exp(-X[n, c, d, h, w + Dim(X, 4)/2]))),
        (Rank(X) == 5) & ((dim == 4) | (dim == -1))
      ),
      (
        X[n, c, h, w] * (1 / (1 + Exp(-X[n, c, h, w + Dim(X, 3)/2]))),
        (Rank(X) == 4) & ((dim == 3) | (dim == -1))
      ),
      (
        X[n, c, l] * (1 / (1 + Exp(-X[n, c, l + Dim(X, 2)/2]))),
        (Rank(X) == 3) & ((dim == 2) | (dim == -1))
      )
    )
  param_map:
    dim: "dim"
  mechanisms:
    - description: "Divisibility check"
      check: "Dim(X, dim) % 2 == 0"
    - description: "Rank support"
      check: "Rank(X) >= 2 and Rank(X) <= 5"

Softmax:
  description: "Applies the Softmax function to an n-dimensional input Tensor."
  definition_type: operator
  math_symbol: >
    Exp(X) / Sum(Exp(X), dim)
  param_map:
    dim: "dim"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Softmin:
  description: "Mathematically equivalent to Softmax(-x)."
  definition_type: operator
  math_symbol: >
    Exp(-X) / Sum(Exp(-X), dim)
  param_map:
    dim: "dim"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

Softmax2d:
  description: "Applies SoftMax over features to each spatial location (dim=1)."
  definition_type: operator
  math_symbol: >
    Exp(X) / Sum(Exp(X), 1)
  mechanisms:
    - description: "Rank check for 2D spatial context"
      check: "Rank(X) >= 2"
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

LogSoftmax:
  description: "Applies the LogSoftmax function."
  definition_type: operator
  math_symbol: >
    Log(Exp(X) / Sum(Exp(X), dim))
  param_map:
    dim: "dim"
  mechanisms:
    - description: "Shape preservation"
      check: "Shape(Output) == Shape(X)"

BatchNorm1d: &BatchNorm1d
  description: "Applies Batch Normalization (Inference Mode)."
  math_symbol: >
    ((X[n, c, l] - running_mean[c]) / Sqrt(running_var[c] + epsilon)) * 
    Piecewise((W[c], affine), (1, True)) + 
    Piecewise((B[c], affine), (0, True))
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"
    - description: "Input rank check"
      check: "Rank(X) == 3"

BatchNorm2d: &BatchNorm2d
  description: "Applies Batch Normalization over a 4D input (N, C, H, W) in inference mode."
  math_symbol: >
    ((X[n, c, h, w] - running_mean[c]) / Sqrt(running_var[c] + epsilon)) * 
    Piecewise((W[c], affine), (1, True)) + 
    Piecewise((B[c], affine), (0, True))
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
    training: "training"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"
    - description: "Input rank check"
      check: "Rank(X) == 4"

BatchNorm3d: &BatchNorm3d
  description: "Applies Batch Normalization (Inference Mode) over a 5D input (N, C, D, H, W)."
  math_symbol: >
    ((X[n, c, d, h, w] - running_mean[c]) / Sqrt(running_var[c] + epsilon)) * 
    Piecewise((W[c], affine), (1, True)) + 
    Piecewise((B[c], affine), (0, True))
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"
    - description: "Input rank check"
      check: "Rank(X) == 5"

LazyBatchNorm1d:
  <<: *BatchNorm1d
  description: "Applies Batch Normalization (1D) with lazy initialization."
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"
    - description: "Input rank check"
      check: "Rank(X) == 3"

LazyBatchNorm2d:
  <<: *BatchNorm2d
  description: "Applies Batch Normalization (2D) with lazy initialization."
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"
    - description: "Input rank check"
      check: "Rank(X) == 4"

LazyBatchNorm3d:
  <<: *BatchNorm3d
  description: "Applies Batch Normalization (3D) with lazy initialization."
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Channel dimension matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"
    - description: "Input rank check"
      check: "Rank(X) == 5"

GroupNorm:
  description: "Applies Group Normalization (N, C, ...)."
  math_symbol: >
    (Reshape(
      (Reshape(X, (Dim(X, 0), G, -1)) - Reshape(mu, (Dim(X, 0), G, 1))) / Sqrt(Reshape(sigma2, (Dim(X, 0), G, 1)) + epsilon), 
      Shape(X)
    )) * Piecewise((W, affine), (1, True)) + Piecewise((B, affine), (0, True))
  derived_variables:
    mu: "Mean(Reshape(X, (Dim(X, 0), G, -1)), 2)"
    sigma2: "Var(Reshape(X, (Dim(X, 0), G, -1)), 2)"
  param_map:
    num_groups: "G"
    num_channels: "cin"
    eps: "epsilon"
    affine: "affine"
  mechanisms:
    - description: "Group divisibility check"
      check: "cin % G == 0"
    - description: "Channel matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"

SyncBatchNorm:
  description: "Applies Batch Normalization with global statistics synchronization (Behaves like BN in Eval)."
  math_symbol: >
    ((X - mu) / Sqrt(sigma2 + epsilon)) * Piecewise((W, affine), (1, True)) + Piecewise((B, affine), (0, True))
  derived_variables:
    mu: >
      Piecewise(
        (running_mean, track_running_stats),
        (Mean(X, (0, 2, 3)), True)
      )
    sigma2: >
      Piecewise(
        (running_var, track_running_stats),
        (Var(X, (0, 2, 3)), True)
      )
  param_map:
    num_features:        "cin"
    eps:                 "epsilon"
    momentum:            "momentum"
    affine:              "affine"
    track_running_stats: "track_running_stats"
    process_group:       "process_group"
  mechanisms:
    - description: "Channel matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"
    - description: "Input Rank Check (Expect 4D NCHW)"
      check: "Rank(X) == 4"

InstanceNorm1d: &InstanceNorm1d
  description: "PyTorch 1D Instance Normalization (N, C, L)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1))) / 
       Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1)), affine), (1, True)) + 
      Piecewise((Reshape(B, (1, Dim(X, 1), 1)), affine), (0, True))
    )
  derived_variables:
    mu: "Mean(X, 2)"
    sigma2: "Var(X, 2)"
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCL)"
      check: "Rank(X) == 3"
    - description: "Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"

InstanceNorm2d: &InstanceNorm2d
  description: "PyTorch 2D Instance Normalization (N, C, H, W)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1, 1))) / 
       Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1, 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1, 1)), affine), (1, True)) + 
      Piecewise((Reshape(B, (1, Dim(X, 1), 1, 1)), affine), (0, True))
    )
  derived_variables:
    mu: "Mean(X, (2, 3))"
    sigma2: "Var(X, (2, 3))"
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCHW)"
      check: "Rank(X) == 4"
    - description: "Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"

InstanceNorm3d: &InstanceNorm3d
  description: "PyTorch 3D Instance Normalization (N, C, D, H, W)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1, 1, 1))) / 
       Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1, 1, 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1, 1, 1)), affine), (1, True)) + 
      Piecewise((Reshape(B, (1, Dim(X, 1), 1, 1, 1)), affine), (0, True))
    )
  derived_variables:
    mu: "Mean(X, (2, 3, 4))"
    sigma2: "Var(X, (2, 3, 4))"
  param_map:
    num_features: "cin"
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCDHW)"
      check: "Rank(X) == 5"
    - description: "Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == cin)"

LazyInstanceNorm1d:
  <<: *InstanceNorm1d
  description: "PyTorch Lazy 1D Instance Normalization (Runtime C inferred)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1))) / 
        Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1)), affine), (1, True)) + 
        Piecewise((Reshape(B, (1, Dim(X, 1), 1)), affine), (0, True))
    )
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCL)"
      check: "Rank(X) == 3"
    - description: "Lazy Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"

LazyInstanceNorm2d:
  <<: *InstanceNorm2d
  description: "PyTorch Lazy 2D Instance Normalization (Runtime C inferred)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1, 1))) / 
       Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1, 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1, 1)), affine), (1, True)) + 
      Piecewise((Reshape(B, (1, Dim(X, 1), 1, 1)), affine), (0, True))
    )
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCHW)"
      check: "Rank(X) == 4"
    - description: "Lazy Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"

LazyInstanceNorm3d:
  <<: *InstanceNorm3d
  description: "PyTorch Lazy 3D Instance Normalization (Runtime C inferred)."
  math_symbol: >
    (
      ((X - Reshape(mu, (Dim(X, 0), Dim(X, 1), 1, 1, 1))) / 
       Sqrt(Reshape(sigma2, (Dim(X, 0), Dim(X, 1), 1, 1, 1)) + epsilon)) * Piecewise((Reshape(W, (1, Dim(X, 1), 1, 1, 1)), affine), (1, True)) + 
      Piecewise((Reshape(B, (1, Dim(X, 1), 1, 1, 1)), affine), (0, True))
    )
  param_map:
    eps: "epsilon"
    momentum: "momentum"
    affine: "affine"
    track_running_stats: "track_running_stats"
  mechanisms:
    - description: "Input Rank Check (NCDHW)"
      check: "Rank(X) == 5"
    - description: "Lazy Channel Parameter Matching"
      check: "Not(affine) | (Dim(W, 0) == Dim(X, 1))"

LayerNorm:
  description: "PyTorch Layer Normalization."
  math_symbol: >
    ((X - mu) / Sqrt(sigma2 + epsilon)) * Piecewise((W, elementwise_affine), (1, True)) + Piecewise((B, bias), (0, True))
  derived_variables:
    reduce_axes: "tuple(range(-len(normalized_shape), 0))"
    mu: "Mean(X, reduce_axes)"
    sigma2: "Var(X, reduce_axes)"
  param_map:
    normalized_shape: "normalized_shape"
    eps: "epsilon"
    elementwise_affine: "elementwise_affine"
    bias: "bias"
  mechanisms:
    - description: "Input tail shape check"
      check: "Shape(X)[-len(normalized_shape):] == normalized_shape"
    - description: "Affine Weight Shape Check"
      check: "Not(elementwise_affine) | (Shape(W) == normalized_shape)"
    - description: "Affine Bias Shape Check"
      check: "Not(bias) | (Shape(B) == normalized_shape)"

RMSNorm:
  description: "Root Mean Square Layer Normalization (No centering)."
  math_symbol: >
    (X * Sqrt(Mean(X**2, reduce_axes) + epsilon)**(-1)) * Piecewise((W, elementwise_affine), (1, True))
  param_map:
    normalized_shape: "normalized_shape"
    eps: "epsilon"
    elementwise_affine: "elementwise_affine"
  mechanisms:
    - description: "Input tail shape check"
      check: "Shape(X)[-len(normalized_shape):] == normalized_shape"
    - description: "Weight Shape Check"
      check: "Not(elementwise_affine) | (Shape(W) == normalized_shape)"

LocalResponseNorm:
  description: "PyTorch Local Response Normalization (Across Channels)."
  definition_type: operator


  math_symbol: >
    X[n, c, h, w] / ((bias_k + (alpha_val / size) * sq_sum) ** beta_val)
  derived_variables:
    sq_sum: >
      Sum(X[n, i, h, w]**2, (i, Max(0, c - (size // 2)), Min(Dim(X, 1)-1, c + (size // 2))))
  output_shape:
    - "n"
    - "Dim(X, 1)"
    - "Dim(X, 2)"
    - "Dim(X, 3)"
  param_map:
    size: "size"
    alpha: "alpha_val"
    beta: "beta_val"
    k: "bias_k"
  mechanisms:
    - description: "Input Rank Check (NCHW)"
      check: "Rank(X) == 4"
    - description: "Divisor Safety"
      check: "bias_k > 0"

Flatten:
  description: "PyTorch Flatten Operator. Collapses dimensions into a single one."
  derived_variables:
    H4: "Dim(X, 2)"
    W4: "Dim(X, 3)"
    Stride_C4: "H4 * W4"
    W3: "Dim(X, 2)"
  math_symbol: >
    Piecewise(
      (
        X[
          n, 
          floor(i / Stride_C4),
          floor((i % Stride_C4) / W4),
          i % W4
        ],
        (Rank(X) == 4) & (start_dim == 1) & (end_dim == -1)
      ),
      (
        X[
          n,
          floor(i / W3),
          i % W3
        ],
        (Rank(X) == 3) & (start_dim == 1) & (end_dim == -1)
      )
    )
  output_shape:
    - "Dim(X, 0)"
    - "Piecewise((Dim(X, 1) * Dim(X, 2) * Dim(X, 3), Rank(X) == 4), (Dim(X, 1) * Dim(X, 2), Rank(X) == 3))"
  param_map:
    start_dim: "start_dim"
    end_dim: "end_dim"
  mechanisms:
    - description: "Current coordinate formula supports rank 3 or rank 4"
      check: "(Rank(X) == 3) | (Rank(X) == 4)"
    - description: "Current coordinate formula preserves the batch dimension"
      check: "start_dim == 1"
    - description: "Current coordinate formula flattens through the final dimension"
      check: "end_dim == -1"
    - description: "Start dimension must be non-negative"
      check: "start_dim >= 0"
    - description: "Start dimension must be within input rank"
      check: "start_dim < Rank(X)"
    - description: "End dimension must be valid"
      check: "end_dim < Rank(X) or end_dim == -1"

Unflatten:
  description: "PyTorch Unflatten Operator. Inverse of Flatten. Maps 1D index back to multi-dim coordinates."
  math_symbol: >
    Piecewise(
      (
        X[n, c * S_C4 + h * d2 + w],
        (Rank(X) == 2) & (dim == 1) & (len(sizes) == 3)
      ),
      (
        X[n, c * S_C3 + h],
        (Rank(X) == 2) & (dim == 1) & (len(sizes) == 2)
      )
    )
  derived_variables:
    d0: "Dim(sizes, 0)"
    d1: "Dim(sizes, 1)"
    d2: "Dim(sizes, 2)"
    S_C4: "d1 * d2"
    S_C3: "d1"
  output_shape:
    - Piecewise(
      ((n, Dim(sizes, 0), Dim(sizes, 1), Dim(sizes, 2)), (Rank(X) == 2) & (Rank(sizes) == 3)),
      ((n, Dim(sizes, 0), Dim(sizes, 1)), (Rank(X) == 2) & (Rank(sizes) == 2))
      )
  param_map:
    dim: "dim"
    unflattened_size: "sizes"
  mechanisms:
    - description: "Unflatten Total Size Match"
      check: "Dim(X, dim) == Piecewise((Dim(sizes, 0)*Dim(sizes, 1)*Dim(sizes, 2), Rank(sizes) == 3), (Dim(sizes, 0)*Dim(sizes, 1), Rank(sizes) == 2), (0, True))"

Linear: &Linear
  description: "Linear operator (Rank 2-5). Channel-first (C at Index 1). Using cin for total features."
  derived_variables:
    cin: "Dim(W, 1)"
    cout: "Dim(W, 0)"
  math_symbol: >
    Piecewise(
      (Sum(X[n, k] * W[out, k], (k, 0, cin - 1)) + B[out], (Rank(X) == 2) & bias),
      (Sum(X[n, k] * W[out, k], (k, 0, cin - 1)), Rank(X) == 2),
      (Sum(X[n, k, l] * W[out, k], (k, 0, cin - 1)) + B[out], (Rank(X) == 3) & bias),
      (Sum(X[n, k, l] * W[out, k], (k, 0, cin - 1)), Rank(X) == 3),
      (Sum(X[n, k, h, w] * W[out, k], (k, 0, cin - 1)) + B[out], (Rank(X) == 4) & bias),
      (Sum(X[n, k, h, w] * W[out, k], (k, 0, cin - 1)), Rank(X) == 4),
      (Sum(X[n, k, d, h, w] * W[out, k], (k, 0, cin - 1)) + B[out], (Rank(X) == 5) & bias),
      (Sum(X[n, k, d, h, w] * W[out, k], (k, 0, cin - 1)), Rank(X) == 5)
    )
  output_shape:
    - Piecewise(
        ((Dim(X, 0), cout), Rank(X) == 2),
        ((Dim(X, 0), cout, Dim(X, 2)), Rank(X) == 3),
        ((Dim(X, 0), cout, Dim(X, 2), Dim(X, 3)), Rank(X) == 4),
        ((Dim(X, 0), cout, Dim(X, 2), Dim(X, 3), Dim(X, 4)), Rank(X) == 5)
      )
  param_map:
    in_features:  cin
    out_features: cout
    bias:         bias
  mechanisms:
    - description: "Channel dimension at Index 1 must match cin"
      check: "Dim(X, 1) == cin"
    - description: "Weight shape check"
      check: "Dim(W, 0) == cout and Dim(W, 1) == cin"

Bilinear:
  description: "Bilinear operator (Rank 2-3). Explicit dual summation."
  output_shape:
    - Piecewise(
        ((n, cout), Rank(X1) == 2),
        ((n, cout, l), Rank(X1) == 3)
      )
  math_symbol: >
    Piecewise(
      (
        Sum(Sum(W[out, k1, k2] * X1[n, k1] * X2[n, k2], (k1, 0, cin1 - 1)), (k2, 0, cin2 - 1)) + B[out], 
        (Rank(X1) == 2) & bias
      ),
      (
        Sum(Sum(W[out, k1, k2] * X1[n, k1] * X2[n, k2], (k1, 0, cin1 - 1)), (k2, 0, cin2 - 1)), 
        Rank(X1) == 2
      ),
      (
        Sum(Sum(W[out, k1, k2] * X1[n, k1, l] * X2[n, k2, l], (k1, 0, cin1 - 1)), (k2, 0, cin2 - 1)) + B[out], 
        (Rank(X1) == 3) & bias
      ),
      (
        Sum(Sum(W[out, k1, k2] * X1[n, k1, l] * X2[n, k2, l], (k1, 0, cin1 - 1)), (k2, 0, cin2 - 1)), 
        Rank(X1) == 3
      )
    )
  param_map:
    in1_features: cin1
    in2_features: cin2
    out_features: cout
    bias: bias
  mechanisms:
    - description: "Input channel consistency check"
      check: "Dim(X1, 1) == cin1 and Dim(X2, 1) == cin2"
    - description: "Weight and Bias alignment"
      check: "Dim(W, 0) == cout and (not bias or Dim(B, 0) == cout)"

MultiheadAttention:
  description: "PyTorch Multi-Head Attention including kdim/vdim separation and sequence augmentation (add_bias_kv, add_zero_attn)."
  definition_type: operator
  math_symbol: >
    Sum(
      (
        Sum(
          Piecewise(
            (
              Sum(
                (
                  Exp(
                    Sum(
                      (Sum(Piecewise((Query[n, l, k_q], batch_first == True), (Query[l, n, k_q], True)) * W_q[h * d_k + i_head, k_q], (k_q, 0, E_q - 1)) + Piecewise((B_q[h * d_k + i_head], bias == True), (0, True))) * Piecewise(
                        (Sum(Piecewise((Key[n, s, k_k], batch_first == True), (Key[s, n, k_k], True)) * W_k[h * d_k + i_head, k_k], (k_k, 0, E_k - 1)) + Piecewise((B_k[h * d_k + i_head], bias == True), (0, True)), s < S_kv),
                        (Bias_k_seq[0, 0, h * d_k + i_head], (add_bias_kv == True) & Eq(s, S_kv)),
                        (0, True)
                      ),
                      (i_head, 0, d_k - 1)
                    ) * (1 / Sqrt(d_k))
                  ) / 
                  Sum(
                    Exp(
                      Sum(
                        (Sum(Piecewise((Query[n, l, k_q], batch_first == True), (Query[l, n, k_q], True)) * W_q[h * d_k + i_head, k_q], (k_q, 0, E_q - 1)) + Piecewise((B_q[h * d_k + i_head], bias == True), (0, True))) * Piecewise(
                          (Sum(Piecewise((Key[n, ss, k_k], batch_first == True), (Key[ss, n, k_k], True)) * W_k[h * d_k + i_head, k_k], (k_k, 0, E_k - 1)) + Piecewise((B_k[h * d_k + i_head], bias == True), (0, True)), ss < S_kv),
                          (Bias_k_seq[0, 0, h * d_k + i_head], (add_bias_kv == True) & Eq(ss, S_kv)),
                          (0, True)
                        ),
                        (i_head, 0, d_k - 1)
                      ) * (1 / Sqrt(d_k))
                    ),
                    (ss, 0, S_kv_ext - 1)
                  )
                ) * Piecewise(
                  (Sum(Piecewise((Value[n, s, k_v], batch_first == True), (Value[s, n, k_v], True)) * W_v[h * d_k + Mod(i_out, d_k), k_v], (k_v, 0, E_v - 1)) + Piecewise((B_v[h * d_k + Mod(i_out, d_k)], bias == True), (0, True)), s < S_kv),
                  (Bias_v_seq[0, 0, h * d_k + Mod(i_out, d_k)], (add_bias_kv == True) & Eq(s, S_kv)),
                  (0, True)
                ),
                (s, 0, S_kv_ext - 1)
              ),
              Eq(h, floor(i_out / d_k))
            ),
            (0, True)
          ) * W_out[out, i_out],
          (i_out, 0, d_model - 1)
        )
      ) + Piecewise((B_out[out], bias == True), (0, True)),
      (h, 0, H - 1)
    )
  output_shape:
    - "Dim(Query, 0)"
    - "Dim(Query, 1)"
    - "d_model"
  derived_variables:
    N: "Piecewise((Dim(Query, 0), batch_first == True), (Dim(Query, 1), True))"
    L: "Piecewise((Dim(Query, 1), batch_first == True), (Dim(Query, 0), True))"
    S_kv: "Piecewise((Dim(Key, 1), batch_first == True), (Dim(Key, 0), True))"
    E_q: "Dim(Query, 2)"
    E_k: "Dim(Key, 2)"
    E_v: "Dim(Value, 2)"
    d_k: "d_model // H"
    S_kv_ext: "S_kv + Piecewise((1, add_bias_kv == True), (0, True)) + Piecewise((1, add_zero_attn == True), (0, True))"
  param_map:
    embed_dim:     "d_model"
    num_heads:     "H"
    dropout:       "dropout"
    bias:          "bias"
    add_bias_kv:   "add_bias_kv"
    add_zero_attn: "add_zero_attn"
    kdim:          "kdim"
    vdim:          "vdim"
    batch_first:   "batch_first"
  mechanisms:
    - description: "Embed Dim Divisibility"
      check: "d_model % H == 0"
    - description: "Query Rank Check"
      check: "Rank(Query) == 3"


TransformerEncoderLayer:
  description: "PyTorch TransformerEncoderLayer in inference semantics. Dropout is identity when eval() or dropout=0."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (Transpose(enc_pre_out, 0, 1), (norm_first == True) & (batch_first == False)),
      (enc_pre_out, norm_first == True),
      (Transpose(enc_post_out, 0, 1), batch_first == False),
      (enc_post_out, True)
    )
  output_shape:
    - "Dim(X, 0)"
    - "Dim(X, 1)"
    - "d_model"
  derived_variables:
    Bsz: "Piecewise((Dim(X, 0), batch_first == True), (Dim(X, 1), True))"
    L: "Piecewise((Dim(X, 1), batch_first == True), (Dim(X, 0), True))"
    d_k: "d_model // H"
    Xc: "Piecewise((X, batch_first == True), (Transpose(X, 0, 1), True))"

    pre_norm1: "((Xc - Mean(Xc, -1)) / Sqrt(Var(Xc, -1) + epsilon)) * W_norm1 + B_norm1"
    pre_self_q: "MatMul(pre_norm1, Transpose(W_self_q, 0, 1)) + B_self_q"
    pre_self_k: "MatMul(pre_norm1, Transpose(W_self_k, 0, 1)) + B_self_k"
    pre_self_v: "MatMul(pre_norm1, Transpose(W_self_v, 0, 1)) + B_self_v"
    pre_self_qh: "Transpose(Reshape(pre_self_q, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_kh: "Transpose(Reshape(pre_self_k, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_vh: "Transpose(Reshape(pre_self_v, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_scores: "MatMul(pre_self_qh, Transpose(pre_self_kh, 2, 3)) / Sqrt(d_k)"
    pre_self_attn: "Softmax(pre_self_scores, -1)"
    pre_self_ctx: "Reshape(Transpose(MatMul(pre_self_attn, pre_self_vh), 1, 2), (Bsz, L, d_model))"
    pre_self_out: "MatMul(pre_self_ctx, Transpose(W_self_out, 0, 1)) + B_self_out"
    pre_attn_res: "Xc + pre_self_out"
    pre_norm2: "((pre_attn_res - Mean(pre_attn_res, -1)) / Sqrt(Var(pre_attn_res, -1) + epsilon)) * W_norm2 + B_norm2"
    pre_ff1: "MatMul(pre_norm2, Transpose(W_linear1, 0, 1)) + B_linear1"
    pre_act: "Piecewise((Max(pre_ff1, 0), activation_id == 1), (0.5 * pre_ff1 * (1 + Erf(pre_ff1 / Sqrt(2))), True))"
    pre_ff2: "MatMul(pre_act, Transpose(W_linear2, 0, 1)) + B_linear2"
    enc_pre_out: "pre_attn_res + pre_ff2"

    post_self_q: "MatMul(Xc, Transpose(W_self_q, 0, 1)) + B_self_q"
    post_self_k: "MatMul(Xc, Transpose(W_self_k, 0, 1)) + B_self_k"
    post_self_v: "MatMul(Xc, Transpose(W_self_v, 0, 1)) + B_self_v"
    post_self_qh: "Transpose(Reshape(post_self_q, (Bsz, L, H, d_k)), 1, 2)"
    post_self_kh: "Transpose(Reshape(post_self_k, (Bsz, L, H, d_k)), 1, 2)"
    post_self_vh: "Transpose(Reshape(post_self_v, (Bsz, L, H, d_k)), 1, 2)"
    post_self_scores: "MatMul(post_self_qh, Transpose(post_self_kh, 2, 3)) / Sqrt(d_k)"
    post_self_attn: "Softmax(post_self_scores, -1)"
    post_self_ctx: "Reshape(Transpose(MatMul(post_self_attn, post_self_vh), 1, 2), (Bsz, L, d_model))"
    post_self_out: "MatMul(post_self_ctx, Transpose(W_self_out, 0, 1)) + B_self_out"
    post_attn_res: "Xc + post_self_out"
    post_norm1: "((post_attn_res - Mean(post_attn_res, -1)) / Sqrt(Var(post_attn_res, -1) + epsilon)) * W_norm1 + B_norm1"
    post_ff1: "MatMul(post_norm1, Transpose(W_linear1, 0, 1)) + B_linear1"
    post_act: "Piecewise((Max(post_ff1, 0), activation_id == 1), (0.5 * post_ff1 * (1 + Erf(post_ff1 / Sqrt(2))), True))"
    post_ff2: "MatMul(post_act, Transpose(W_linear2, 0, 1)) + B_linear2"
    post_ff_res: "post_norm1 + post_ff2"
    enc_post_out: "((post_ff_res - Mean(post_ff_res, -1)) / Sqrt(Var(post_ff_res, -1) + epsilon)) * W_norm2 + B_norm2"
  param_map:
    d_model: "d_model"
    nhead: "H"
    dim_feedforward: "d_ff"
    dropout: "dropout"
    batch_first: "batch_first"
    norm_first: "norm_first"
    bias: "bias"
    layer_norm_eps: "epsilon"
    activation_id: "activation_id"
    training: "training"
  mechanisms:
    - description: "Input Rank Check"
      check: "Rank(X) == 3"
    - description: "Embedding Dimension Consistency"
      check: "Dim(X, 2) == d_model"
    - description: "Head Dimension Consistency"
      check: "d_model % H == 0"
    - description: "FeedForward Dimension Validity"
      check: "d_ff > 0"
    - description: "Deterministic Dropout Semantics"
      check: "(training == False) or (dropout == 0)"

Dropout:
  definition_type: operator
  description: "PyTorch Dropout in inference/training semantics. Evaluation mode is identity."
  math_symbol: >
    Piecewise(
      (X * Bernoulli(1 - p, axis) * (1 / (1 - p)), training == True),
      (X, True)
    )
  param_map:
    p: "p"
    training: "training"
  output_shape:
    - "Shape(X)"
  mechanisms:
    - description: "Probability range check"
      check: "(p >= 0) and (p < 1)"

Dropout2d:
  definition_type: operator
  description: "PyTorch channel-wise Dropout2d. Evaluation mode is identity."
  math_symbol: >
    Piecewise(
      (X, training == True),
      (X, True)
    )
  param_map:
    p: "p"
    training: "training"
  output_shape:
    - "Shape(X)"
  mechanisms:
    - description: "Rank check"
      check: "Rank(X) == 4"
    - description: "Probability range check"
      check: "(p >= 0) and (p < 1)"

Dropout3d:
  definition_type: operator
  description: "PyTorch channel-wise Dropout3d. Evaluation mode is identity."
  math_symbol: >
    Piecewise(
      (X, training == True),
      (X, True)
    )
  param_map:
    p: "p"
    training: "training"
  output_shape:
    - "Shape(X)"
  mechanisms:
    - description: "Rank check"
      check: "Rank(X) == 5"
    - description: "Probability range check"
      check: "(p >= 0) and (p < 1)"

TransformerDecoderLayer:
  description: "PyTorch TransformerDecoderLayer in inference semantics. Dropout is identity when eval() or dropout=0."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (Transpose(dec_pre_out, 0, 1), (norm_first == True) & (batch_first == False)),
      (dec_pre_out, norm_first == True),
      (Transpose(dec_post_out, 0, 1), batch_first == False),
      (dec_post_out, True)
    )
  output_shape:
    - "Dim(X, 0)"
    - "Dim(X, 1)"
    - "d_model"
  derived_variables:
    Bsz: "Piecewise((Dim(X, 0), batch_first == True), (Dim(X, 1), True))"
    L: "Piecewise((Dim(X, 1), batch_first == True), (Dim(X, 0), True))"
    L_mem: "Piecewise((Dim(Memory, 1), batch_first == True), (Dim(Memory, 0), True))"
    d_k: "d_model // H"
    Xc: "Piecewise((X, batch_first == True), (Transpose(X, 0, 1), True))"
    Mc: "Piecewise((Memory, batch_first == True), (Transpose(Memory, 0, 1), True))"

    pre_norm1: "((Xc - Mean(Xc, -1)) / Sqrt(Var(Xc, -1) + epsilon)) * W_norm1 + B_norm1"
    pre_self_q: "MatMul(pre_norm1, Transpose(W_self_q, 0, 1)) + B_self_q"
    pre_self_k: "MatMul(pre_norm1, Transpose(W_self_k, 0, 1)) + B_self_k"
    pre_self_v: "MatMul(pre_norm1, Transpose(W_self_v, 0, 1)) + B_self_v"
    pre_self_qh: "Transpose(Reshape(pre_self_q, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_kh: "Transpose(Reshape(pre_self_k, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_vh: "Transpose(Reshape(pre_self_v, (Bsz, L, H, d_k)), 1, 2)"
    pre_self_scores: "MatMul(pre_self_qh, Transpose(pre_self_kh, 2, 3)) / Sqrt(d_k)"
    pre_self_attn: "Softmax(pre_self_scores, -1)"
    pre_self_ctx: "Reshape(Transpose(MatMul(pre_self_attn, pre_self_vh), 1, 2), (Bsz, L, d_model))"
    pre_self_out: "MatMul(pre_self_ctx, Transpose(W_self_out, 0, 1)) + B_self_out"
    pre_self_res: "Xc + pre_self_out"
    pre_norm2: "((pre_self_res - Mean(pre_self_res, -1)) / Sqrt(Var(pre_self_res, -1) + epsilon)) * W_norm2 + B_norm2"
    pre_cross_q: "MatMul(pre_norm2, Transpose(W_cross_q, 0, 1)) + B_cross_q"
    pre_cross_k: "MatMul(Mc, Transpose(W_cross_k, 0, 1)) + B_cross_k"
    pre_cross_v: "MatMul(Mc, Transpose(W_cross_v, 0, 1)) + B_cross_v"
    pre_cross_qh: "Transpose(Reshape(pre_cross_q, (Bsz, L, H, d_k)), 1, 2)"
    pre_cross_kh: "Transpose(Reshape(pre_cross_k, (Bsz, L_mem, H, d_k)), 1, 2)"
    pre_cross_vh: "Transpose(Reshape(pre_cross_v, (Bsz, L_mem, H, d_k)), 1, 2)"
    pre_cross_scores: "MatMul(pre_cross_qh, Transpose(pre_cross_kh, 2, 3)) / Sqrt(d_k)"
    pre_cross_attn: "Softmax(pre_cross_scores, -1)"
    pre_cross_ctx: "Reshape(Transpose(MatMul(pre_cross_attn, pre_cross_vh), 1, 2), (Bsz, L, d_model))"
    pre_cross_out: "MatMul(pre_cross_ctx, Transpose(W_cross_out, 0, 1)) + B_cross_out"
    pre_cross_res: "pre_self_res + pre_cross_out"
    pre_norm3: "((pre_cross_res - Mean(pre_cross_res, -1)) / Sqrt(Var(pre_cross_res, -1) + epsilon)) * W_norm3 + B_norm3"
    pre_ff1: "MatMul(pre_norm3, Transpose(W_linear1, 0, 1)) + B_linear1"
    pre_act: "Piecewise((Max(pre_ff1, 0), activation_id == 1), (0.5 * pre_ff1 * (1 + Erf(pre_ff1 / Sqrt(2))), True))"
    pre_ff2: "MatMul(pre_act, Transpose(W_linear2, 0, 1)) + B_linear2"
    dec_pre_out: "pre_cross_res + pre_ff2"

    post_self_q: "MatMul(Xc, Transpose(W_self_q, 0, 1)) + B_self_q"
    post_self_k: "MatMul(Xc, Transpose(W_self_k, 0, 1)) + B_self_k"
    post_self_v: "MatMul(Xc, Transpose(W_self_v, 0, 1)) + B_self_v"
    post_self_qh: "Transpose(Reshape(post_self_q, (Bsz, L, H, d_k)), 1, 2)"
    post_self_kh: "Transpose(Reshape(post_self_k, (Bsz, L, H, d_k)), 1, 2)"
    post_self_vh: "Transpose(Reshape(post_self_v, (Bsz, L, H, d_k)), 1, 2)"
    post_self_scores: "MatMul(post_self_qh, Transpose(post_self_kh, 2, 3)) / Sqrt(d_k)"
    post_self_attn: "Softmax(post_self_scores, -1)"
    post_self_ctx: "Reshape(Transpose(MatMul(post_self_attn, post_self_vh), 1, 2), (Bsz, L, d_model))"
    post_self_out: "MatMul(post_self_ctx, Transpose(W_self_out, 0, 1)) + B_self_out"
    post_self_res: "Xc + post_self_out"
    post_norm1: "((post_self_res - Mean(post_self_res, -1)) / Sqrt(Var(post_self_res, -1) + epsilon)) * W_norm1 + B_norm1"
    post_cross_q: "MatMul(post_norm1, Transpose(W_cross_q, 0, 1)) + B_cross_q"
    post_cross_k: "MatMul(Mc, Transpose(W_cross_k, 0, 1)) + B_cross_k"
    post_cross_v: "MatMul(Mc, Transpose(W_cross_v, 0, 1)) + B_cross_v"
    post_cross_qh: "Transpose(Reshape(post_cross_q, (Bsz, L, H, d_k)), 1, 2)"
    post_cross_kh: "Transpose(Reshape(post_cross_k, (Bsz, L_mem, H, d_k)), 1, 2)"
    post_cross_vh: "Transpose(Reshape(post_cross_v, (Bsz, L_mem, H, d_k)), 1, 2)"
    post_cross_scores: "MatMul(post_cross_qh, Transpose(post_cross_kh, 2, 3)) / Sqrt(d_k)"
    post_cross_attn: "Softmax(post_cross_scores, -1)"
    post_cross_ctx: "Reshape(Transpose(MatMul(post_cross_attn, post_cross_vh), 1, 2), (Bsz, L, d_model))"
    post_cross_out: "MatMul(post_cross_ctx, Transpose(W_cross_out, 0, 1)) + B_cross_out"
    post_cross_res: "post_norm1 + post_cross_out"
    post_norm2: "((post_cross_res - Mean(post_cross_res, -1)) / Sqrt(Var(post_cross_res, -1) + epsilon)) * W_norm2 + B_norm2"
    post_ff1: "MatMul(post_norm2, Transpose(W_linear1, 0, 1)) + B_linear1"
    post_act: "Piecewise((Max(post_ff1, 0), activation_id == 1), (0.5 * post_ff1 * (1 + Erf(post_ff1 / Sqrt(2))), True))"
    post_ff2: "MatMul(post_act, Transpose(W_linear2, 0, 1)) + B_linear2"
    post_ff_res: "post_norm2 + post_ff2"
    dec_post_out: "((post_ff_res - Mean(post_ff_res, -1)) / Sqrt(Var(post_ff_res, -1) + epsilon)) * W_norm3 + B_norm3"
  param_map:
    d_model: "d_model"
    nhead: "H"
    dim_feedforward: "d_ff"
    dropout: "dropout"
    batch_first: "batch_first"
    norm_first: "norm_first"
    bias: "bias"
