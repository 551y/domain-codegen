ConstantPad1d:
  description: "Pads the input tensor boundaries with a constant value."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (pad_val, (w - pad_l) < 0),
      (pad_val, (w - pad_l) >= Dim(X, 2)),
      (X[n, c, w - pad_l], True)
    )
  param_map:
    padding: [ "pad_l", "pad_r" ]
    value: "pad_val"
  output_shape:
