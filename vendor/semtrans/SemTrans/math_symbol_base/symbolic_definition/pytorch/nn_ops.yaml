Conv1d: &Conv1d
  description: "PyTorch 1D Convolution"
  derived_variables:
    cin: "Dim(W, 1) * G"
    cout: "Dim(W, 0)"
    K: "Dim(W, 2)"
  default_values:
    padding_mode: "zeros"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, l*Strd + k*Dil - P], 
          (l*Strd + k*Dil - P >= 0) & (l*Strd + k*Dil - P < Dim(X, 2))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, l*Strd + k*Dil - P < 0),                
              (Dim(X, 2) - 1, l*Strd + k*Dil - P >= Dim(X, 2)), 
              (l*Strd + k*Dil - P, True)               
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, (l*Strd + k*Dil - P) % Dim(X, 2)], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
                (Abs(l*Strd + k*Dil - P), l*Strd + k*Dil - P < 0), 
                (2*(Dim(X, 2) - 1) - (l*Strd + k*Dil - P), l*Strd + k*Dil - P >= Dim(X, 2)), 
                (l*Strd + k*Dil - P, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * Piecewise(
         (W[out, Mod(c, floor(cin/G)), k], Eq(floor(out / (cout/G)), floor(c / (cin/G)))),
         (0, True)
      ),
      (c, 0, cin - 1),
      (k, 0, K - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "floor((Dim(X, 2) + 2*P - Dil*(K - 1) - 1)/Strd + 1)"
  param_map:
    in_channels:  "cin"
    out_channels: "cout"
    kernel_size:  "K"
    stride:       "Strd"
    padding:      "P"
    dilation:     "Dil"
    groups:       "G"
    bias:         "bias"
    padding_mode: "padding_mode"
  mechanisms:
    - description: "Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"
    - description: "Input Channels Match"
      check: "Dim(X, 1) == cin"
    - description: "Weight Shape Check"
      check: "(Dim(W, 0) == cout) & (Dim(W, 2) == K)"

Conv2d: &Conv2d
  description: "PyTorch 2D Convolution with Grouped Support"
  derived_variables:
    cin: "Dim(W, 1) * G"
    cout: "Dim(W, 0)"
    K_h: "Dim(W, 2)"
    K_w: "Dim(W, 3)"
  default_values:
    padding_mode: "zeros"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
          (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 2)) &
          (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 3))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, h*S_h+kh*D_h-P_h < 0), 
              (Dim(X, 2)-1, h*S_h+kh*D_h-P_h >= Dim(X, 2)), 
              (h*S_h+kh*D_h-P_h, True)
            ),
            Piecewise(
              (0, w*S_w+kw*D_w-P_w < 0), 
              (Dim(X, 3)-1, w*S_w+kw*D_w-P_w >= Dim(X, 3)), 
              (w*S_w+kw*D_w-P_w, True)
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, (h*S_h + kh*D_h - P_h) % Dim(X, 2), (w*S_w + kw*D_w - P_w) % Dim(X, 3)], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
               (Abs(h*S_h+kh*D_h-P_h), h*S_h+kh*D_h-P_h < 0),
               (2*(Dim(X, 2)-1)-(h*S_h+kh*D_h-P_h), h*S_h+kh*D_h-P_h >= Dim(X, 2)),
               (h*S_h+kh*D_h-P_h, True)
             ),
             Piecewise(
               (Abs(w*S_w+kw*D_w-P_w), w*S_w+kw*D_w-P_w < 0),
               (2*(Dim(X, 3)-1)-(w*S_w+kw*D_w-P_w), w*S_w+kw*D_w-P_w >= Dim(X, 3)),
               (w*S_w+kw*D_w-P_w, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * W[out, Mod(c, floor(cin/G)), kh, kw] * Piecewise((1, floor(c * G / cin) == floor(out * G / cout)), (0, True)),  
      (c, 0, cin - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "floor((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)"
    - "floor((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"
  param_map:
    in_channels:    "cin"
    out_channels:   "cout"
    kernel_size:    ["K_h", "K_w"]
    stride:         ["S_h", "S_w"]
    padding:        ["P_h", "P_w"]
    dilation:       ["D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
    padding_mode:   "padding_mode"
  mechanisms:
    - description: "Input Rank Check"
      check: "Rank(X) == 4"
    - description: "Channel Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"
    - description: "Input Channels Match"
      check: "Dim(X, 1) == cin"

Conv3d: &Conv3d
  description: "PyTorch 3D Convolution"
  derived_variables:
    cin: "Dim(W, 1) * G"
    cout: "Dim(W, 0)"
    K_d: "Dim(W, 2)"
    K_h: "Dim(W, 3)"
    K_w: "Dim(W, 4)"
  default_values:
    padding_mode: "zeros"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
          (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) &
          (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) &
          (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, d*S_d+kd*D_d-P_d < 0), 
              (Dim(X, 2)-1, d*S_d+kd*D_d-P_d >= Dim(X, 2)), 
              (d*S_d+kd*D_d-P_d, True)
            ),
            Piecewise(
              (0, h*S_h+kh*D_h-P_h < 0), 
              (Dim(X, 3)-1, h*S_h+kh*D_h-P_h >= Dim(X, 3)), 
              (h*S_h+kh*D_h-P_h, True)
            ),
            Piecewise(
              (0, w*S_w+kw*D_w-P_w < 0), 
              (Dim(X, 4)-1, w*S_w+kw*D_w-P_w >= Dim(X, 4)), 
              (w*S_w+kw*D_w-P_w, True)
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, 
            (d*S_d + kd*D_d - P_d) % Dim(X, 2), 
            (h*S_h + kh*D_h - P_h) % Dim(X, 3), 
            (w*S_w + kw*D_w - P_w) % Dim(X, 4)
          ], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
               (Abs(d*S_d+kd*D_d-P_d), d*S_d+kd*D_d-P_d < 0),
               (2*(Dim(X, 2)-1)-(d*S_d+kd*D_d-P_d), d*S_d+kd*D_d-P_d >= Dim(X, 2)),
               (d*S_d+kd*D_d-P_d, True)
             ),
             Piecewise(
               (Abs(h*S_h+kh*D_h-P_h), h*S_h+kh*D_h-P_h < 0),
               (2*(Dim(X, 3)-1)-(h*S_h+kh*D_h-P_h), h*S_h+kh*D_h-P_h >= Dim(X, 3)),
               (h*S_h+kh*D_h-P_h, True)
             ),
             Piecewise(
               (Abs(w*S_w+kw*D_w-P_w), w*S_w+kw*D_w-P_w < 0),
               (2*(Dim(X, 4)-1)-(w*S_w+kw*D_w-P_w), w*S_w+kw*D_w-P_w >= Dim(X, 4)),
               (w*S_w+kw*D_w-P_w, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * W[out, Mod(c, floor(cin/G)), kd, kh, kw] * Piecewise((1, floor(c * G / cin) == floor(out * G / cout)), (0, True)),
      (c, 0, cin - 1), (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "floor((Dim(X, 2) + 2*P_d - D_d*(K_d-1) - 1)/S_d + 1)"
    - "floor((Dim(X, 3) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)"
    - "floor((Dim(X, 4) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"
  param_map:
    in_channels: "cin"
    out_channels: "cout"
    kernel_size: ["K_d", "K_h", "K_w"]
    stride: ["S_d", "S_h", "S_w"]
    padding: ["P_d", "P_h", "P_w"]
    dilation: ["D_d", "D_h", "D_w"]
    groups: "G"
    bias: "bias"
    padding_mode: "padding_mode"
  mechanisms:
    - description: "Input Rank Check"
      check: "Rank(X) == 5"
    - description: "Channel Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"
    - description: "Input Channels Match"
      check: "Dim(X, 1) == cin"

ConvTranspose1d: &ConvTranspose1d
  description: "PyTorch 1D Transposed Convolution"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, floor((l + P - k * Dil) / Strd)],
          ((l + P - k * Dil) % Strd == 0) &
          (floor((l + P - k * Dil) / Strd) >= 0) &
          (floor((l + P - k * Dil) / Strd) < Dim(X, 2))
        ),
        (0, True)
      ) * W[c, out % floor(cout/G), k] * Piecewise((1, floor(c * G / cin) == floor(out * G / cout)), (0, True)),
      (c, 0, cin - 1), (k, 0, K - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "(Dim(X, 2) - 1) * Strd - 2 * P + Dil * (K - 1) + P_out + 1"
  param_map:
    in_channels:    "cin"
    out_channels:   "cout"
    kernel_size:    "K"
    stride:         "Strd"
    padding:        "P"
    output_padding: "P_out"
    dilation:       "Dil"
    groups:         "G"
    bias:           "bias"
  mechanisms:
    - description: "Output Padding Constraint"
      check: "P_out < Strd"
    - description: "Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"

ConvTranspose2d: &ConvTranspose2d
  description: "PyTorch 2D Transposed Convolution"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, 
            floor((h + P_h - kh * D_h) / S_h), 
            floor((w + P_w - kw * D_w) / S_w)
          ],
          (Mod(h + P_h - kh * D_h, S_h) == 0) &                
          (floor((h + P_h - kh * D_h) / S_h) >= 0) &                
          (floor((h + P_h - kh * D_h) / S_h) < Dim(X, 2)) &   
          (Mod(w + P_w - kw * D_w, S_w) == 0) &               
          (floor((w + P_w - kw * D_w) / S_w) >= 0) &                
          (floor((w + P_w - kw * D_w) / S_w) < Dim(X, 3))    
        ),
        (0, True)
      ) * W[c, out % floor(cout/G), kh, kw] * Piecewise((1, floor(c * G / cin) == floor(out * G / cout)), (0, True)),
      (c, 0, cin - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "(Dim(X, 2) - 1) * S_h - 2 * P_h + D_h * (K_h - 1) + P_out_h + 1"
    - "(Dim(X, 3) - 1) * S_w - 2 * P_w + D_w * (K_w - 1) + P_out_w + 1"
  param_map:
    in_channels:    "cin"
    out_channels:   "cout"
    kernel_size:    ["K_h", "K_w"]
    stride:         ["S_h", "S_w"]
    padding:        ["P_h", "P_w"]
    output_padding: ["P_out_h", "P_out_w"]
    dilation:       ["D_h", "D_w"]
    groups:         "G"
    bias:           "bias"

  mechanisms:
    - description: "Output Padding Constraint"
      check: "(P_out_h < S_h) & (P_out_w < S_w)"
    - description: "Channel Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"

ConvTranspose3d: &ConvTranspose3d
  description: "PyTorch 3D Transposed Convolution"
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, 
            floor((d + P_d - kd * D_d) / S_d), 
            floor((h + P_h - kh * D_h) / S_h), 
            floor((w + P_w - kw * D_w) / S_w)
          ],
          ((d + P_d - kd * D_d) % S_d == 0) & 
          (floor((d + P_d - kd * D_d) / S_d) >= 0) & 
          (floor((d + P_d - kd * D_d) / S_d) < Dim(X, 2)) & 
          ((h + P_h - kh * D_h) % S_h == 0) & 
          (floor((h + P_h - kh * D_h) / S_h) >= 0) & 
          (floor((h + P_h - kh * D_h) / S_h) < Dim(X, 3)) & 
          ((w + P_w - kw * D_w) % S_w == 0) & 
          (floor((w + P_w - kw * D_w) / S_w) >= 0) & 
          (floor((w + P_w - kw * D_w) / S_w) < Dim(X, 4))  
        ),
        (0, True)
      ) * W[c, out % floor(cout / G), kd, kh, kw] * Piecewise((1, floor(c * G / cin) == floor(out * G / cout)), (0, True)),
      (c, 0, cin - 1), (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  output_shape:
    - Dim(X, 0)
    - "cout"
    - "(Dim(X, 2) - 1) * S_d - 2 * P_d + D_d * (K_d - 1) + P_out_d + 1"
    - "(Dim(X, 3) - 1) * S_h - 2 * P_h + D_h * (K_h - 1) + P_out_h + 1"
    - "(Dim(X, 4) - 1) * S_w - 2 * P_w + D_w * (K_w - 1) + P_out_w + 1"
  param_map:
    in_channels:    "cin"
    out_channels:   "cout"
    kernel_size:    ["K_d", "K_h", "K_w"]
    stride:         ["S_d", "S_h", "S_w"]
    padding:        ["P_d", "P_h", "P_w"]
    output_padding: ["P_out_d", "P_out_h", "P_out_w"]
    dilation:       ["D_d", "D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
  mechanisms:
    - description: "Channel Group Divisibility"
      check: "(cin % G == 0) & (cout % G == 0)"
    - description: "Output Padding Constraint"
      check: "(P_out_d < S_d) & (P_out_h < S_h) & (P_out_w < S_w)"

LazyConv1d:
  <<: *Conv1d
  description: "PyTorch 1D Convolution with lazy initialization. in_channels is inferred from input."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, l*Strd + k*Dil - P], 
          (l*Strd + k*Dil - P >= 0) & (l*Strd + k*Dil - P < Dim(X, 2))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, l*Strd + k*Dil - P < 0),                
              (Dim(X, 2) - 1, l*Strd + k*Dil - P >= Dim(X, 2)), 
              (l*Strd + k*Dil - P, True)               
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, (l*Strd + k*Dil - P) % Dim(X, 2)], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
                (Abs(l*Strd + k*Dil - P), l*Strd + k*Dil - P < 0), 
                (2*(Dim(X, 2) - 1) - (l*Strd + k*Dil - P), l*Strd + k*Dil - P >= Dim(X, 2)), 
                (l*Strd + k*Dil - P, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * Piecewise(
         (W[out, Mod(c, floor(Dim(X, 1)/G)), k], Eq(floor(out / (cout/G)), floor(c / (Dim(X, 1)/G)))),
         (0, True)
      ),
      (c, 0, Dim(X, 1) - 1),
      (k, 0, K - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels: "cout"
    kernel_size:  "K"
    stride:       "Strd"
    padding:      "P"
    dilation:     "Dil"
    groups:       "G"
    bias:         "bias"
    padding_mode: "padding_mode"
  mechanisms:
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"
    - description: "Weight Shape Check"
      check: "(Dim(W, 0) == cout) & (Dim(W, 2) == K)"

LazyConv2d:
  <<: *Conv2d
  description: "PyTorch 2D Convolution with lazy initialization. in_channels is inferred from input."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
          (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 2)) & 
          (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 3))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, h*S_h + kh*D_h - P_h < 0),
              (Dim(X, 2) - 1, h*S_h + kh*D_h - P_h >= Dim(X, 2)),
              (h*S_h + kh*D_h - P_h, True)
            ),
            Piecewise(
              (0, w*S_w + kw*D_w - P_w < 0),
              (Dim(X, 3) - 1, w*S_w + kw*D_w - P_w >= Dim(X, 3)),
              (w*S_w + kw*D_w - P_w, True)
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, 
            (h*S_h + kh*D_h - P_h) % Dim(X, 2), 
            (w*S_w + kw*D_w - P_w) % Dim(X, 3)
          ], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
                (Abs(h*S_h + kh*D_h - P_h), h*S_h + kh*D_h - P_h < 0), 
                (2*(Dim(X, 2) - 1) - (h*S_h + kh*D_h - P_h), h*S_h + kh*D_h - P_h >= Dim(X, 2)), 
                (h*S_h + kh*D_h - P_h, True)
             ),
             Piecewise(
                (Abs(w*S_w + kw*D_w - P_w), w*S_w + kw*D_w - P_w < 0), 
                (2*(Dim(X, 3) - 1) - (w*S_w + kw*D_w - P_w), w*S_w + kw*D_w - P_w >= Dim(X, 3)), 
                (w*S_w + kw*D_w - P_w, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * Piecewise(
         (W[out, Mod(c, floor(Dim(X, 1)/G)), kh, kw], Eq(floor(out / (cout/G)), floor(c / (Dim(X, 1)/G)))),
         (0, True)
      ),
      (c, 0, Dim(X, 1) - 1),
      (kh, 0, K_h - 1),
      (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels:   "cout"
    kernel_size:    ["K_h", "K_w"]
    stride:         ["S_h", "S_w"]
    padding:        ["P_h", "P_w"]
    dilation:       ["D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
    padding_mode:   "padding_mode"
  mechanisms:
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"
    - description: "Weight Shape Check"
      check: "(Dim(W, 0) == cout) & (Dim(W, 2) == K_h) & (Dim(W, 3) == K_w)"

LazyConv3d:
  <<: *Conv3d
  description: "PyTorch 3D Convolution with lazy initialization. in_channels is inferred from input."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
          (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) & 
          (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) & 
          (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
        ),
        (
          X[n, c, 
            Piecewise(
              (0, d*S_d + kd*D_d - P_d < 0),
              (Dim(X, 2) - 1, d*S_d + kd*D_d - P_d >= Dim(X, 2)),
              (d*S_d + kd*D_d - P_d, True)
            ),
            Piecewise(
              (0, h*S_h + kh*D_h - P_h < 0),
              (Dim(X, 3) - 1, h*S_h + kh*D_h - P_h >= Dim(X, 3)),
              (h*S_h + kh*D_h - P_h, True)
            ),
            Piecewise(
              (0, w*S_w + kw*D_w - P_w < 0),
              (Dim(X, 4) - 1, w*S_w + kw*D_w - P_w >= Dim(X, 4)),
              (w*S_w + kw*D_w - P_w, True)
            )
          ], 
          padding_mode == 'replicate'
        ),
        (
          X[n, c, 
            (d*S_d + kd*D_d - P_d) % Dim(X, 2), 
            (h*S_h + kh*D_h - P_h) % Dim(X, 3),
            (w*S_w + kw*D_w - P_w) % Dim(X, 4)
          ], 
          padding_mode == 'circular'
        ),
        (
          X[n, c, 
             Piecewise(
                (Abs(d*S_d + kd*D_d - P_d), d*S_d + kd*D_d - P_d < 0), 
                (2*(Dim(X, 2) - 1) - (d*S_d + kd*D_d - P_d), d*S_d + kd*D_d - P_d >= Dim(X, 2)), 
                (d*S_d + kd*D_d - P_d, True)
             ),
             Piecewise(
                (Abs(h*S_h + kh*D_h - P_h), h*S_h + kh*D_h - P_h < 0), 
                (2*(Dim(X, 3) - 1) - (h*S_h + kh*D_h - P_h), h*S_h + kh*D_h - P_h >= Dim(X, 3)), 
                (h*S_h + kh*D_h - P_h, True)
             ),
             Piecewise(
                (Abs(w*S_w + kw*D_w - P_w), w*S_w + kw*D_w - P_w < 0), 
                (2*(Dim(X, 4) - 1) - (w*S_w + kw*D_w - P_w), w*S_w + kw*D_w - P_w >= Dim(X, 4)), 
                (w*S_w + kw*D_w - P_w, True)
             )
          ], 
          padding_mode == 'reflect'
        ),
        (0, True)
      ) * Piecewise(
         (W[out, Mod(c, floor(Dim(X, 1)/G)), kd, kh, kw], Eq(floor(out / (cout/G)), floor(c / (Dim(X, 1)/G)))),
         (0, True)
      ),
      (c, 0, Dim(X, 1) - 1),
      (kd, 0, K_d - 1),
      (kh, 0, K_h - 1),
      (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels:   "cout"
    kernel_size:    ["K_d", "K_h", "K_w"]
    stride:         ["S_d", "S_h", "S_w"]
    padding:        ["P_d", "P_h", "P_w"]
    dilation:       ["D_d", "D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
    padding_mode:   "padding_mode"
  mechanisms:
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"
    - description: "Weight Shape Check"
      check: "(Dim(W, 0) == cout) & (Dim(W, 2) == K_d) & (Dim(W, 3) == K_h) & (Dim(W, 4) == K_w)"

LazyConvTranspose1d:
  <<: *ConvTranspose1d
  description: "PyTorch 1D Transposed Convolution with lazy initialization. Inferred in_channels."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, floor((l + P - k * Dil) / Strd)],
          ((l + P - k * Dil) % Strd == 0) &
          (floor((l + P - k * Dil) / Strd) >= 0) &
          (floor((l + P - k * Dil) / Strd) < Dim(X, 2))
        ),
        (0, True)
      ) * W[c, out % floor(cout/G), k] * Piecewise((1, floor(c * G / Dim(X, 1)) == floor(out * G / cout)), (0, True)),
      (c, 0, Dim(X, 1) - 1), (k, 0, K - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels:   "cout"
    kernel_size:    "K"
    stride:         "Strd"
    padding:        "P"
    output_padding: "P_out"
    dilation:       "Dil"
    groups:         "G"
    bias:           "bias"
  mechanisms:
    - description: "Output Padding Constraint"
      check: "P_out < Strd"
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"

LazyConvTranspose2d:
  <<: *ConvTranspose2d
  description: "PyTorch 2D Transposed Convolution with lazy initialization. Inferred in_channels."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, 
            floor((h + P_h - kh * D_h) / S_h), 
            floor((w + P_w - kw * D_w) / S_w)
          ],
          ((h + P_h - kh * D_h) % S_h == 0) & 
          (floor((h + P_h - kh * D_h) / S_h) >= 0) & 
          (floor((h + P_h - kh * D_h) / S_h) < Dim(X, 2)) & 
          ((w + P_w - kw * D_w) % S_w == 0) & 
          (floor((w + P_w - kw * D_w) / S_w) >= 0) & 
          (floor((w + P_w - kw * D_w) / S_w) < Dim(X, 3))
        ),
        (0, True)
      ) * W[c, out % floor(cout / G), kh, kw] * Piecewise((1, floor(c * G / Dim(X, 1)) == floor(out * G / cout)), (0, True)),
      (c, 0, Dim(X, 1) - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels:   "cout"
    kernel_size:    ["K_h", "K_w"]
    stride:         ["S_h", "S_w"]
    padding:        ["P_h", "P_w"]
    output_padding: ["P_out_h", "P_out_w"]
    dilation:       ["D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
  mechanisms:
    - description: "Output Padding Constraint"
      check: "(P_out_h < S_h) & (P_out_w < S_w)"
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"

LazyConvTranspose3d:
  <<: *ConvTranspose3d
  description: "PyTorch 3D Transposed Convolution with lazy initialization. Inferred in_channels."
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, c, 
            floor((d + P_d - kd * D_d) / S_d), 
            floor((h + P_h - kh * D_h) / S_h), 
            floor((w + P_w - kw * D_w) / S_w)
          ],
          ((d + P_d - kd * D_d) % S_d == 0) & 
          (floor((d + P_d - kd * D_d) / S_d) >= 0) & 
          (floor((d + P_d - kd * D_d) / S_d) < Dim(X, 2)) & 
          ((h + P_h - kh * D_h) % S_h == 0) & 
          (floor((h + P_h - kh * D_h) / S_h) >= 0) & 
          (floor((h + P_h - kh * D_h) / S_h) < Dim(X, 3)) & 
          ((w + P_w - kw * D_w) % S_w == 0) & 
          (floor((w + P_w - kw * D_w) / S_w) >= 0) & 
          (floor((w + P_w - kw * D_w) / S_w) < Dim(X, 4))  
        ),
        (0, True)
      ) * W[c, out % floor(cout / G), kd, kh, kw] * Piecewise((1, floor(c * G / Dim(X, 1)) == floor(out * G / cout)), (0, True)),
      (c, 0, Dim(X, 1) - 1), (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    ) + Piecewise((B[out], bias == True), (0, True))
  param_map:
    out_channels:   "cout"
    kernel_size:    ["K_d", "K_h", "K_w"]
    stride:         ["S_d", "S_h", "S_w"]
    padding:        ["P_d", "P_h", "P_w"]
    output_padding: ["P_out_d", "P_out_h", "P_out_w"]
    dilation:       ["D_d", "D_h", "D_w"]
    groups:         "G"
    bias:           "bias"
  mechanisms:
    - description: "Output Padding Constraint"
      check: "(P_out_d < S_d) & (P_out_h < S_h) & (P_out_w < S_w)"
    - description: "Group Divisibility"
      check: "(Dim(X, 1) % G == 0) & (cout % G == 0)"

Unfold:
  description: "PyTorch Unfold (Im2Col). Maps input patches to flattened columns."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (
        X[n, 
          c // (K_h * K_w), 
          (l // ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_h 
          + ((c % (K_h * K_w)) // K_w) * D_h 
          - P_h,
          (l % ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_w 
          + ((c % (K_h * K_w)) % K_w) * D_w 
          - P_w
        ],
        ((l // ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_h + ((c % (K_h * K_w)) // K_w) * D_h - P_h >= 0) &
        ((l // ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_h + ((c % (K_h * K_w)) // K_w) * D_h - P_h < Dim(X, 2)) &
        ((l % ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_w + ((c % (K_h * K_w)) % K_w) * D_w - P_w >= 0) &
        ((l % ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)) * S_w + ((c % (K_h * K_w)) % K_w) * D_w - P_w < Dim(X, 3))
      ),
      (0, True) 
    )
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1) * K_h * K_w
    - ((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1) // S_h + 1) * ((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)
  param_map:
    kernel_size: ["K_h", "K_w"]
    dilation:    ["D_h", "D_w"]
    padding:     ["P_h", "P_w"]
    stride:      ["S_h", "S_w"]
  mechanisms:
    - description: "Input Rank Check"
      check: "Rank(X) == 4"

Fold:
  description: "PyTorch Fold (Col2Im). Sums sliding blocks back into a tensor."
  definition_type: operator
  math_symbol: >
    Sum(
      Piecewise(
        (
          X[n, 
            c * (K_h * K_w) + kh * K_w + kw, 
            ((h + P_h - kh*D_h) // S_h) * ((W_out + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1) 
            + ((w + P_w - kw*D_w) // S_w)
          ],
          ((h + P_h - kh*D_h) % S_h == 0) &
          ((h + P_h - kh*D_h) // S_h >= 0) &
          (((h + P_h - kh*D_h) // S_h) < ((H_out + 2*P_h - D_h*(K_h-1) - 1) // S_h + 1)) &
          ((w + P_w - kw*D_w) % S_w == 0) &
          ((w + P_w - kw*D_w) // S_w >= 0) &
          (((w + P_w - kw*D_w) // S_w) < ((W_out + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1))
        ),
        (0, True)
      ),
      (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    )
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1) // (K_h * K_w)
    - "H_out"
    - "W_out"
  param_map:
    output_size: ["H_out", "W_out"]
    kernel_size: ["K_h", "K_w"]
    dilation:    ["D_h", "D_w"]
    padding:     ["P_h", "P_w"]
    stride:      ["S_h", "S_w"]
  mechanisms:
    - description: "Channel Block Divisibility"
      check: "Dim(X, 1) % (K_h * K_w) == 0"
    - description: "Input Length Consistency"
      check: >
        Dim(X, 2) == 
        ((H_out + 2*P_h - D_h*(K_h-1) - 1) // S_h + 1) * ((W_out + 2*P_w - D_w*(K_w-1) - 1) // S_w + 1)
        


MaxPool1d: &MaxPool1d
  description: "PyTorch 1D Max Pooling with Indices"
  definition_type: operator
  math_symbol:
    - Max(
        Piecewise(
          (X[n, c, l*Strd + k*Dil - P], 
           (l*Strd + k*Dil - P >= 0) & (l*Strd + k*Dil - P < Dim(X, 2))
          ),
          (neg_infinity, True)
        ),
        (k, 0, K - 1)
      )
    - Piecewise(
        (
          (l * Strd - P) + ArgMax(
            Piecewise(
              (X[n, c, l*Strd + k*Dil - P], 
               (l*Strd + k*Dil - P >= 0) & (l*Strd + k*Dil - P < Dim(X, 2))
              ),
              (neg_infinity, True)
            ),
            (k, 0, K - 1)
          ) * Dil,
          return_indices
        ),
        (0, True)
      )
  output_shape:
    - ["Dim(X, 0)", "Dim(X, 1)", "floor((Dim(X, 2) + 2*P - Dil*(K-1) - 1)/Strd + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P - Dil*(K-1) - 1)/Strd + 1)"]
    - ["Dim(X, 0)", "Dim(X, 1)", "floor((Dim(X, 2) + 2*P - Dil*(K-1) - 1)/Strd + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P - Dil*(K-1) - 1)/Strd + 1)"]
  param_map:
    kernel_size:    "K"
    stride:         "Strd"
    padding:        "P"
    dilation:       "Dil"
    ceil_mode:      "ceil_mode"
    return_indices: "return_indices"
  mechanisms:
    - description: "Padding Constraint"
      check: "P <= floor(K / 2)"

MaxPool2d: &MaxPool2d
  description: "2D Max Pooling with Indices"
  definition_type: operator
  math_symbol:
    - Max(
        Piecewise(
          (X[n, c, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
           (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 2)) &
           (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 3))
          ),
          (neg_infinity, True)
        ),
        (kh, 0, K_h - 1), (kw, 0, K_w - 1)
      )
    - Piecewise(
        (
          (h * S_h - P_h + 
             floor(
                ArgMax(
                  Piecewise(
                    (X[n, c, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
                     (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 2)) &
                     (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 3))
                    ),
                    (neg_infinity, True)
                  ),
                  (kh, 0, K_h - 1), (kw, 0, K_w - 1)
                ) / K_w
             ) * D_h
          ) * Dim(X, 3) + 
          (w * S_w - P_w + 
             Mod(
                ArgMax(
                  Piecewise(
                    (X[n, c, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
                     (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 2)) &
                     (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 3))
                    ),
                    (neg_infinity, True)
                  ),
                  (kh, 0, K_h - 1), (kw, 0, K_w - 1)
                ), K_w
             ) * D_w
          ),
          return_indices
        ),
        (0, True)
      )
  output_shape:
    - ["Dim(X, 0)", "Dim(X, 1)",
       "floor((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)",
       "floor((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1) if not ceil_mode else ceiling((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"]
    - ["Dim(X, 0)", "Dim(X, 1)",
       "floor((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)",
       "floor((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1) if not ceil_mode else ceiling((Dim(X, 3) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"]
  param_map:
    kernel_size:    ["K_h", "K_w"]
    stride:         ["S_h", "S_w"]
    padding:        ["P_h", "P_w"]
    dilation:       ["D_h", "D_w"]
    ceil_mode:      "ceil_mode"
    return_indices: "return_indices"
  mechanisms:
    - description: "Padding Constraint"
      check: "(P_h <= floor(K_h / 2)) & (P_w <= floor(K_w / 2))"

MaxPool3d: &MaxPool3d
  description: "3D Max Pooling. Sliding window maximum with optional indices return."
  definition_type: operator
  math_symbol:
    - Max(
        Piecewise(
          (X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
           (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) &
           (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) &
           (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
          ),
          (neg_infinity, True)
        ),
        (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
      )
    - Piecewise(
        (
          (d * S_d - P_d + 
             floor(
               ArgMax(
                 Piecewise(
                   (X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
                    (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) &
                    (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) &
                    (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
                   ),
                   (neg_infinity, True)
                 ),
                 (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
               ) / (K_w * K_h)
             ) * D_d
          ) * (Dim(X, 3) * Dim(X, 4)) +
          (h * S_h - P_h + 
             Mod(
               floor(
                 ArgMax(
                   Piecewise(
                     (X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
                      (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) &
                      (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) &
                      (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
                     ),
                     (neg_infinity, True)
                   ),
                   (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
                 ) / K_w
               ), K_h
             ) * D_h
          ) * Dim(X, 4) +
          (w * S_w - P_w + 
             Mod(
               ArgMax(
                 Piecewise(
                   (X[n, c, d*S_d + kd*D_d - P_d, h*S_h + kh*D_h - P_h, w*S_w + kw*D_w - P_w], 
                    (d*S_d + kd*D_d - P_d >= 0) & (d*S_d + kd*D_d - P_d < Dim(X, 2)) &
                    (h*S_h + kh*D_h - P_h >= 0) & (h*S_h + kh*D_h - P_h < Dim(X, 3)) &
                    (w*S_w + kw*D_w - P_w >= 0) & (w*S_w + kw*D_w - P_w < Dim(X, 4))
                   ),
                   (neg_infinity, True)
                 ),
                 (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
               ), K_w
             ) * D_w
          ),
          return_indices
        ),
        (0, True)
      )
  output_shape:
    - ["Dim(X, 0)", "Dim(X, 1)",
       "floor((Dim(X, 2) + 2*P_d - D_d*(K_d-1) - 1)/S_d + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P_d - D_d*(K_d-1) - 1)/S_d + 1)",
       "floor((Dim(X, 3) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1) if not ceil_mode else ceiling((Dim(X, 3) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)",
       "floor((Dim(X, 4) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1) if not ceil_mode else ceiling((Dim(X, 4) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"]
    - ["Dim(X, 0)", "Dim(X, 1)",
       "floor((Dim(X, 2) + 2*P_d - D_d*(K_d-1) - 1)/S_d + 1) if not ceil_mode else ceiling((Dim(X, 2) + 2*P_d - D_d*(K_d-1) - 1)/S_d + 1)",
       "floor((Dim(X, 3) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1) if not ceil_mode else ceiling((Dim(X, 3) + 2*P_h - D_h*(K_h-1) - 1)/S_h + 1)",
       "floor((Dim(X, 4) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1) if not ceil_mode else ceiling((Dim(X, 4) + 2*P_w - D_w*(K_w-1) - 1)/S_w + 1)"]
  param_map:
    kernel_size:    ["K_d", "K_h", "K_w"]
    stride:         ["S_d", "S_h", "S_w"]
    padding:        ["P_d", "P_h", "P_w"]
    dilation:       ["D_d", "D_h", "D_w"]
    ceil_mode:      "ceil_mode"
    return_indices: "return_indices"
  mechanisms:
    - description: "Padding Constraint"
      check: "(P_d <= floor(K_d / 2)) & (P_h <= floor(K_h / 2)) & (P_w <= floor(K_w / 2))"

MaxUnpool1d:
  description: "1D Max Unpooling. Restores values to indices locations. Handles overlapping indices by averaging to simulate assignment."
  definition_type: "operator"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - (Dim(X, 2) - 1) * Strd - 2 * P + K
  math_symbol: >
    Sum(Piecewise((X[n, c, il], Eq(A[n, c, il], l)), (0, True)), (il, 0, Dim(X, 2) - 1)) / 
    (Sum(Piecewise((1, Eq(A[n, c, il], l)), (0, True)), (il, 0, Dim(X, 2) - 1)) + 1e-9)
  param_map:
    kernel_size: "K"
    stride:      "Strd"
    padding:     "P"
  mechanisms:
    - description: "The length of the data tensor (X) and index tensor (A) must be identical."
      check: "Eq(Dim(X, 2), Dim(A, 2))"
    - description: "Input and Indices must have at least 3 dimensions (N, C, L)."
      check: "Rank(X) >= 3"

MaxUnpool2d:
  math_symbol: >
    Sum(
      Piecewise((X[n, c, ih, iw], Eq(A[n, c, ih, iw], h * Dim(Y, 3) + w)), (0, True)),
      (ih, 0, Dim(X, 2) - 1), (iw, 0, Dim(X, 3) - 1)
    ) / (
      Sum(
        Piecewise((1, Eq(A[n, c, ih, iw], h * Dim(Y, 3) + w)), (0, True)),
        (ih, 0, Dim(X, 2) - 1), (iw, 0, Dim(X, 3) - 1)
      ) + 1e-9
    )
  output_shape:
    - "Dim(X, 0)"
    - "Dim(X, 1)"
    - "(Dim(X, 2) - 1) * S_h - 2 * P_h + K_h"
    - "(Dim(X, 3) - 1) * S_w - 2 * P_w + K_w"
  param_map:
    kernel_size: ["K_h", "K_w"]
    stride: ["S_h", "S_w"]
    padding: ["P_h", "P_w"]
  mechanisms:
    - description: "Spatial dimensions of Input and Indices must be identical."
      check: "Eq(Dim(X, 2), Dim(A, 2)) & Eq(Dim(X, 3), Dim(A, 3))"

MaxUnpool3d:
  description: "3D Max Unpooling. Restores values using spatial coordinates (d, h, w) mapped to flattened indices via physical dimensions Dim(Y, 3) and Dim(Y, 4)."
  definition_type: "operator"
  output_shape:
    - "Dim(X, 0)"
    - "Dim(X, 1)"
    - "(Dim(X, 2) - 1) * S_d - 2 * P_d + K_d"
    - "(Dim(X, 3) - 1) * S_h - 2 * P_h + K_h"
    - "(Dim(X, 4) - 1) * S_w - 2 * P_w + K_w"
  math_symbol: >
    Sum(
      Piecewise((X[n, c, id, ih, iw], Eq(A[n, c, id, ih, iw], d * Dim(Y, 3) * Dim(Y, 4) + h * Dim(Y, 4) + w)), (0, True)),
      (id, 0, Dim(X, 2) - 1), (ih, 0, Dim(X, 3) - 1), (iw, 0, Dim(X, 4) - 1)
    ) / (
      Sum(
        Piecewise((1, Eq(A[n, c, id, ih, iw], d * Dim(Y, 3) * Dim(Y, 4) + h * Dim(Y, 4) + w)), (0, True)),
        (id, 0, Dim(X, 2) - 1), (ih, 0, Dim(X, 3) - 1), (iw, 0, Dim(X, 4) - 1)
      ) + 1e-9
    )
  param_map:
    kernel_size: ["K_d", "K_h", "K_w"]
    stride: ["S_d", "S_h", "S_w"]
    padding: ["P_d", "P_h", "P_w"]
  mechanisms:
    - description: "Spatial dimensions (D, H, W) of Input and Indices must be identical."
      check: "Eq(Dim(X, 2), Dim(A, 2)) & Eq(Dim(X, 3), Dim(A, 3)) & Eq(Dim(X, 4), Dim(A, 4))"

AvgPool1d:
  description: "1D Average Pooling. Divisor logic strictly handles ceil_mode out-of-bounds."
  definition_type: operator
  math_symbol: >
    Sum(
      Piecewise(
        (X[n, c, Strd * w + m - P], (Strd * w + m - P >= 0) & (Strd * w + m - P < Dim(X, 2))),
        (0, True)
      ),
      (m, 0, K - 1)
    ) / Max(
      Sum(
        Piecewise(
          (1, (Strd * w + m - P >= 0) & (Strd * w + m - P < Dim(X, 2))),
          (Piecewise((1, count_include_pad), (0, True)), (Strd * w + m - P >= -P) & (Strd * w + m - P < Dim(X, 2) + P)),
          (0, True)
        ),
        (m, 0, K - 1)
      ),
      1
    )
  param_map:
    kernel_size: "K"
    stride: "Strd"
    padding: "P"
    ceil_mode: "ceil_mode"
    count_include_pad: "count_include_pad"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise(
        (ceiling((Dim(X, 2) + 2 * P - K) / Strd + 1), ceil_mode),
        (floor((Dim(X, 2) + 2 * P - K) / Strd + 1), True)
      )
  mechanisms:
    - description: "Padding Constraint"
      check: "P <= K / 2"
    - description: "Stride Positive"
      check: "Strd > 0"

AvgPool2d:
  description: "PyTorch 2D Average Pooling (Clean Symbols: i/j for Out, kh/kw for Kernel)."
  definition_type: operator
  math_symbol: >
    Sum(
      Sum(
        (
          X[n, c, 
            Max(0, Min(S_h * i + kh - P_h, Dim(X, 2) - 1)), 
            Max(0, Min(S_w * j + kw - P_w, Dim(X, 3) - 1))
          ] * Piecewise(
            (1, (S_h * i + kh - P_h >= 0) & (S_h * i + kh - P_h < Dim(X, 2)) &
                (S_w * j + kw - P_w >= 0) & (S_w * j + kw - P_w < Dim(X, 3))),
            (0, True)
          )
        ),
        (kw, 0, K_w - 1)
      ),
      (kh, 0, K_h - 1)
    ) / Piecewise(
      (safe_div, safe_div > 0),
      (
        Piecewise(
          (K_h * K_w, count_include_pad & Not(ceil_mode)),
          (
            (Min(S_h * i - P_h + K_h, Dim(X, 2)) - Max(S_h * i - P_h, 0)) * (Min(S_w * j - P_w + K_w, Dim(X, 3)) - Max(S_w * j - P_w, 0)),
            True
          )
        ),
        True
      )
    )
  derived_variables:
    safe_div: >
      Piecewise(
        (0, Eq(divisor_override, S_None)),
        (divisor_override, True)
      )
  param_map:
    kernel_size: ["K_h", "K_w"]
    stride: ["S_h", "S_w"]
    padding: ["P_h", "P_w"]
    ceil_mode: "ceil_mode"
    count_include_pad: "count_include_pad"
    divisor_override: "divisor_override"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise((ceiling((Dim(X, 2) + 2 * P_h - K_h) / S_h + 1), ceil_mode), (floor((Dim(X, 2) + 2 * P_h - K_h) / S_h + 1), True))
    - Piecewise((ceiling((Dim(X, 3) + 2 * P_w - K_w) / S_w + 1), ceil_mode), (floor((Dim(X, 3) + 2 * P_w - K_w) / S_w + 1), True))
  mechanisms:
    - description: "Stride Positive"
      check: "(S_h > 0) & (S_w > 0)"

AvgPool3d:
  description: "3D Average Pooling with robust dynamic divisor and ceil_mode alignment."
  definition_type: operator
  derived_variables:
    safe_div: "Piecewise((0, Eq(divisor_override, S_None)), (divisor_override, True))"
  math_symbol: >
    Sum(Sum(Sum(
      Piecewise(
        (X[n, c, S_d * d + kd - P_d, S_h * h + kh - P_h, S_w * w + kw - P_w], 
         (S_d * d + kd - P_d >= 0) & (S_d * d + kd - P_d < Dim(X, 2)) &
         (S_h * h + kh - P_h >= 0) & (S_h * h + kh - P_h < Dim(X, 3)) &
         (S_w * w + kw - P_w >= 0) & (S_w * w + kw - P_w < Dim(X, 4))),
        (0, True)
      ),
      (kw, 0, K_w - 1)), (kh, 0, K_h - 1)), (kd, 0, K_d - 1)
    ) / Piecewise(
      (Max(safe_div, 1), safe_div > 0),
      (Max(
        Sum(Sum(Sum(
          Piecewise(
            (1, (S_d * d + kd - P_d >= 0) & (S_d * d + kd - P_d < Dim(X, 2)) &
                (S_h * h + kh - P_h >= 0) & (S_h * h + kh - P_h < Dim(X, 3)) &
                (S_w * w + kw - P_w >= 0) & (S_w * w + kw - P_w < Dim(X, 4))),
            (Piecewise((1, count_include_pad), (0, True)), 
                (S_d * d + kd - P_d >= -P_d) & (S_d * d + kd - P_d < Dim(X, 2) + P_d) &
                (S_h * h + kh - P_h >= -P_h) & (S_h * h + kh - P_h < Dim(X, 3) + P_h) &
                (S_w * w + kw - P_w >= -P_w) & (S_w * w + kw - P_w < Dim(X, 4) + P_w)),
            (0, True)
          ),
          (kw, 0, K_w - 1)), (kh, 0, K_h - 1)), (kd, 0, K_d - 1)
        ), 1), True)
    )
  param_map:
    kernel_size: ["K_d", "K_h", "K_w"]
    stride: ["S_d", "S_h", "S_w"]
    padding: ["P_d", "P_h", "P_w"]
    ceil_mode: "ceil_mode"
    count_include_pad: "count_include_pad"
    divisor_override: "divisor_override"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise((ceiling((Dim(X, 2) + 2 * P_d - K_d) / S_d + 1), ceil_mode), (floor((Dim(X, 2) + 2 * P_d - K_d) / S_d + 1), True))
    - Piecewise((ceiling((Dim(X, 3) + 2 * P_h - K_h) / S_h + 1), ceil_mode), (floor((Dim(X, 3) + 2 * P_h - K_h) / S_h + 1), True))
    - Piecewise((ceiling((Dim(X, 4) + 2 * P_w - K_w) / S_w + 1), ceil_mode), (floor((Dim(X, 4) + 2 * P_w - K_w) / S_w + 1), True))
  mechanisms:
    - description: "Divisor constraint"
      check: "safe_div >= 0"

FractionalMaxPool2d:
  description: "2D Fractional Max Pooling (Explicit Formula)"
  definition_type: operator
  math_symbol: >
    Max(
      Piecewise(
        (X[n, c, floor(h * Dim(X, 2) / Dim(Y, 2)) + kh, floor(w * Dim(X, 3) / Dim(Y, 3)) + kw],
         And(kh + floor(h * Dim(X, 2) / Dim(Y, 2)) < Dim(X, 2), 
             kw + floor(w * Dim(X, 3) / Dim(Y, 3)) < Dim(X, 3))),
        (-99999.0, True)
      ),
      (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    )
  param_map:
    kernel_size: ["K_h", "K_w"]
    output_size: ["H_out", "W_out"]
    output_ratio: ["R_h", "R_w"]
  default_values:
    H_out: -1
    W_out: -1
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise((H_out, H_out > 0), (floor(Dim(X, 2) * R_h), True))
    - Piecewise((W_out, W_out > 0), (floor(Dim(X, 3) * R_w), True))
  mechanisms:
    - description: "Kernel Fit Constraint"
      check: "((K_h <= Dim(X, 2)) & (K_w <= Dim(X, 3)))"

FractionalMaxPool3d:
  description: "3D Fractional Max Pooling"
  definition_type: operator
  math_symbol: >
    Max(
      Piecewise(
        (X[n, c, floor(d * Dim(X, 2) / Dim(Y, 2)) + kd, floor(h * Dim(X, 3) / Dim(Y, 3)) + kh, floor(w * Dim(X, 4) / Dim(Y, 4)) + kw],
         And(
           kd + floor(d * Dim(X, 2) / Dim(Y, 2)) < Dim(X, 2),
           kh + floor(h * Dim(X, 3) / Dim(Y, 3)) < Dim(X, 3),
           kw + floor(w * Dim(X, 4) / Dim(Y, 4)) < Dim(X, 4)
         )
        ),
        (-99999.0, True)
      ),
      (kd, 0, K_d - 1), (kh, 0, K_h - 1), (kw, 0, K_w - 1)
    )
  param_map:
    kernel_size: ["K_d", "K_h", "K_w"]
    output_size: ["D_out", "H_out", "W_out"]
    output_ratio: ["R_d", "R_h", "R_w"]
  default_values:
    D_out: -1
    H_out: -1
    W_out: -1
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise((D_out, D_out > 0), (floor(Dim(X, 2) * R_d), True))
    - Piecewise((H_out, H_out > 0), (floor(Dim(X, 3) * R_h), True))
    - Piecewise((W_out, W_out > 0), (floor(Dim(X, 4) * R_w), True))
  mechanisms:
    - description: "Kernel Fit Constraint"
      check: "(K_d <= Dim(X, 2)) & (K_h <= Dim(X, 3)) & (K_w <= Dim(X, 4))"

LPPool1d:
  description: "1D Power-Average Pooling (Lp Norm)"
  definition_type: operator
  math_symbol: >
    Sum(
      Piecewise(
        (Abs(X[n, c, Strd * w + m]) ** p_norm, 
         (Strd * w + m >= 0) & (Strd * w + m < Dim(X, 2))),
        (0, True)
      ),
      (m, 0, K - 1)
    ) ** (1 / p_norm)
  param_map:
    norm_type: "p_norm"
    kernel_size: "K"
    stride: "Strd"
    ceil_mode: "ceil_mode"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise(
        (ceiling((Dim(X, 2) - K) / Strd + 1), ceil_mode),
        (floor((Dim(X, 2) - K) / Strd + 1), True)
      )
  mechanisms:
    - description: "Valid Kernel"
      check: "K > 0"
    - description: "Valid Stride"
      check: "Strd > 0"
    - description: "Valid Norm"
      check: "p_norm != 0"

LPPool2d:
  description: "2D Power-Average Pooling (Lp Norm)"
  definition_type: operator
  math_symbol: >
    Sum(
      Sum(
        Piecewise(
          (Abs(X[n, c, S_h * h + kh, S_w * w + kw]) ** p_norm,
           (S_h * h + kh >= 0) & (S_h * h + kh < Dim(X, 2)) &
           (S_w * w + kw >= 0) & (S_w * w + kw < Dim(X, 3))),
          (0, True)
        ),
        (kw, 0, K_w - 1)
      ),
      (kh, 0, K_h - 1)
    ) ** (1 / p_norm)
  param_map:
    norm_type: "p_norm"
    kernel_size: ["K_h", "K_w"]
    stride: ["S_h", "S_w"]
    ceil_mode: "ceil_mode"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    # Height
    - Piecewise(
        (ceiling((Dim(X, 2) - K_h) / S_h + 1), ceil_mode),
        (floor((Dim(X, 2) - K_h) / S_h + 1), True)
      )
    # Width
    - Piecewise(
        (ceiling((Dim(X, 3) - K_w) / S_w + 1), ceil_mode),
        (floor((Dim(X, 3) - K_w) / S_w + 1), True)
      )
  mechanisms:
    - description: "Valid Kernel Size"
      check: "(K_h > 0) & (K_w > 0)"
    - description: "Valid Stride"
      check: "(S_h > 0) & (S_w > 0)"
    - description: "Valid Power Norm"
      check: "p_norm != 0"

LPPool3d:
  description: "3D Power-Average Pooling (Lp Norm)"
  definition_type: operator
  math_symbol: >
    Sum(
      Sum(
        Sum(
          Piecewise(
            (Abs(X[n, c, S_d * d + kd, S_h * h + kh, S_w * w + kw]) ** p_norm,
             (S_d * d + kd >= 0) & (S_d * d + kd < Dim(X, 2)) &
             (S_h * h + kh >= 0) & (S_h * h + kh < Dim(X, 3)) &
             (S_w * w + kw >= 0) & (S_w * w + kw < Dim(X, 4))),
            (0, True)
          ),
          (kw, 0, K_w - 1)
        ),
        (kh, 0, K_h - 1)
      ),
      (kd, 0, K_d - 1)
    ) ** (1 / p_norm)
  param_map:
    norm_type: "p_norm"
    kernel_size: ["K_d", "K_h", "K_w"]
    stride: ["S_d", "S_h", "S_w"]
    ceil_mode: "ceil_mode"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Piecewise(
        (ceiling((Dim(X, 2) - K_d) / S_d + 1), ceil_mode),
        (floor((Dim(X, 2) - K_d) / S_d + 1), True)
      )
    - Piecewise(
        (ceiling((Dim(X, 3) - K_h) / S_h + 1), ceil_mode),
        (floor((Dim(X, 3) - K_h) / S_h + 1), True)
      )
    - Piecewise(
        (ceiling((Dim(X, 4) - K_w) / S_w + 1), ceil_mode),
        (floor((Dim(X, 4) - K_w) / S_w + 1), True)
      )
  mechanisms:
    - description: "Valid Kernel Size"
      check: "(K_d > 0) & (K_h > 0) & (K_w > 0)"
    - description: "Valid Stride"
      check: "(S_d > 0) & (S_h > 0) & (S_w > 0)"
    - description: "Valid Power Norm"
      check: "p_norm != 0"

AdaptiveMaxPool1d:
  description: "Applies a 1D adaptive max pooling (Optimized Local Window)."
  definition_type: operator
  derived_variables:
    L_in: "Dim(X, 2)"
    win_max: "ceiling(Dim(X, 2) / W_out)"
  math_symbol: >
    Max(
      Piecewise(
        (X[n, c, floor(w * L_in / W_out) + k], 
         (floor(w * L_in / W_out) + k < ceiling((w + 1) * L_in / W_out)) & 
         (floor(w * L_in / W_out) + k < L_in)),
        (neg_infinity, True)
      ),
      (k, 0, win_max)
    )
  param_map:
    output_size: "W_out"
    return_indices: "return_indices"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "W_out > 0"

AdaptiveMaxPool2d:
  description: "Applies a 2D adaptive max pooling (Optimized Local Window)."
  definition_type: operator
  derived_variables:
    H_in: "Dim(X, 2)"
    W_in: "Dim(X, 3)"
    win_h_max: "ceiling(Dim(X, 2) / H_out)"
    win_w_max: "ceiling(Dim(X, 3) / W_out)"
  math_symbol: >
    Max(
      Max(
        Piecewise(
          (X[n, c, floor(h * H_in / H_out) + kh, floor(w * W_in / W_out) + kw],
           (floor(h * H_in / H_out) + kh < ceiling((h + 1) * H_in / H_out)) &
           (floor(w * W_in / W_out) + kw < ceiling((w + 1) * W_in / W_out)) &
           (floor(h * H_in / H_out) + kh < H_in) &
           (floor(w * W_in / W_out) + kw < W_in)),
          (neg_infinity, True)
        ),
        (kw, 0, win_w_max)
      ),
      (kh, 0, win_h_max)
    )
  param_map:
    output_size: ["H_out", "W_out"]
    return_indices: "return_indices"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - H_out
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "(H_out > 0) & (W_out > 0)"

AdaptiveMaxPool3d:
  description: "Applies a 3D adaptive max pooling (Optimized Local Window)."
  definition_type: operator
  derived_variables:
    D_in: "Dim(X, 2)"
    H_in: "Dim(X, 3)"
    W_in: "Dim(X, 4)"
    win_d_max: "ceiling(Dim(X, 2) / D_out)"
    win_h_max: "ceiling(Dim(X, 3) / H_out)"
    win_w_max: "ceiling(Dim(X, 4) / W_out)"
  math_symbol: >
    Max(
      Max(
        Max(
          Piecewise(
            (X[n, c, floor(d * D_in / D_out) + kd, floor(h * H_in / H_out) + kh, floor(w * W_in / W_out) + kw],
             (floor(d * D_in / D_out) + kd < ceiling((d + 1) * D_in / D_out)) &
             (floor(h * H_in / H_out) + kh < ceiling((h + 1) * H_in / H_out)) &
             (floor(w * W_in / W_out) + kw < ceiling((w + 1) * W_in / W_out)) &
             (floor(d * D_in / D_out) + kd < D_in) &
             (floor(h * H_in / H_out) + kh < H_in) &
             (floor(w * W_in / W_out) + kw < W_in)),
            (neg_infinity, True)
          ),
          (kw, 0, win_w_max)
        ),
        (kh, 0, win_h_max)
      ),
      (kd, 0, win_d_max)
    )
  param_map:
    output_size: ["D_out", "H_out", "W_out"]
    return_indices: "return_indices"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - D_out
    - H_out
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "(D_out > 0) & (H_out > 0) & (W_out > 0)"

AdaptiveAvgPool1d:
  description: "Applies a 1D adaptive average pooling."
  definition_type: operator
  math_symbol: >
    Sum(
      Piecewise(
        (X[n, c, k], 
         (k >= floor(w * Dim(X, 2) / W_out)) & 
         (k < ceiling((w + 1) * Dim(X, 2) / W_out))),
        (0, True)
      ),
      (k, 0, Dim(X, 2) - 1)
    ) / (ceiling((w + 1) * Dim(X, 2) / W_out) - floor(w * Dim(X, 2) / W_out))
  param_map:
    output_size: "W_out"
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "W_out > 0"

AdaptiveAvgPool2d:
  description: "Applies a 2D adaptive average pooling."
  definition_type: operator
  math_symbol: >
    Sum(
      Sum(
        Piecewise(
          (X[n, c, kh, kw],
           (kh >= floor(h * Dim(X, 2) / H_out)) & 
           (kh < ceiling((h + 1) * Dim(X, 2) / H_out)) &
           (kw >= floor(w * Dim(X, 3) / W_out)) & 
           (kw < ceiling((w + 1) * Dim(X, 3) / W_out))),
          (0, True)
        ),
        (kw, 0, Dim(X, 3) - 1)
      ),
      (kh, 0, Dim(X, 2) - 1)
    ) / (
      (ceiling((h + 1) * Dim(X, 2) / H_out) - floor(h * Dim(X, 2) / H_out)) * (ceiling((w + 1) * Dim(X, 3) / W_out) - floor(w * Dim(X, 3) / W_out))
    )
  param_map:
    output_size: ["H_out", "W_out"]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - H_out
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "(H_out > 0) & (W_out > 0)"

AdaptiveAvgPool3d:
  description: "Applies a 3D adaptive average pooling."
  definition_type: operator
  math_symbol: >
    Sum(
      Sum(
        Sum(
          Piecewise(
            (X[n, c, kd, kh, kw],
             (kd >= floor(d * Dim(X, 2) / D_out)) & 
             (kd < ceiling((d + 1) * Dim(X, 2) / D_out)) &
             (kh >= floor(h * Dim(X, 3) / H_out)) & 
             (kh < ceiling((h + 1) * Dim(X, 3) / H_out)) &
             (kw >= floor(w * Dim(X, 4) / W_out)) & 
             (kw < ceiling((w + 1) * Dim(X, 4) / W_out))),
            (0, True)
          ),
          (kw, 0, Dim(X, 4) - 1)
        ),
        (kh, 0, Dim(X, 3) - 1)
      ),
      (kd, 0, Dim(X, 2) - 1)
    ) / (
      (ceiling((d + 1) * Dim(X, 2) / D_out) - floor(d * Dim(X, 2) / D_out)) *
      (ceiling((h + 1) * Dim(X, 3) / H_out) - floor(h * Dim(X, 3) / H_out)) *
      (ceiling((w + 1) * Dim(X, 4) / W_out) - floor(w * Dim(X, 4) / W_out))
    )
  param_map:
    output_size: ["D_out", "H_out", "W_out"]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - D_out
    - H_out
    - W_out
  mechanisms:
    - description: "Valid Output Size"
      check: "(D_out > 0) & (H_out > 0) & (W_out > 0)"

ReflectionPad1d:
  description: "Pads the input tensor using reflection."
  definition_type: operator
  math_symbol: >
    X[n, c, 
      Piecewise(
        (-1 * (w - pad_l), (w - pad_l) < 0),
        (2 * (Dim(X, 2) - 1) - (w - pad_l), (w - pad_l) >= Dim(X, 2)),
        (w - pad_l, True)
      )
    ]
  param_map:
    padding: [ "pad_l", "pad_r" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_l + pad_r
  mechanisms:
    - description: "Padding size constraint"
      check: "(pad_l < Dim(X, 2)) & (pad_r < Dim(X, 2))"

ReflectionPad2d:
  description: "Pads the input tensor using reflection."
  definition_type: operator
  math_symbol: >
    X[n, c,
      Piecewise(
        (-1 * (h - pad_t), (h - pad_t) < 0),
        (2 * (Dim(X, 2) - 1) - (h - pad_t), (h - pad_t) >= Dim(X, 2)),
        (h - pad_t, True)
      ),
      Piecewise(
        (-1 * (w - pad_l), (w - pad_l) < 0),
        (2 * (Dim(X, 3) - 1) - (w - pad_l), (w - pad_l) >= Dim(X, 3)),
        (w - pad_l, True)
      )
    ]
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_t + pad_b
    - Dim(X, 3) + pad_l + pad_r
  mechanisms:
    - description: "Padding size constraint"
      check: >
        (pad_l < Dim(X, 3)) & (pad_r < Dim(X, 3)) &
        (pad_t < Dim(X, 2)) & (pad_b < Dim(X, 2))

ReflectionPad3d:
  description: "Pads the input tensor using reflection."
  definition_type: operator
  math_symbol: >
    X[n, c,
      Piecewise(
        (-1 * (d - pad_f), (d - pad_f) < 0),
        (2 * (Dim(X, 2) - 1) - (d - pad_f), (d - pad_f) >= Dim(X, 2)),
        (d - pad_f, True)
      ),
      Piecewise(
        (-1 * (h - pad_t), (h - pad_t) < 0),
        (2 * (Dim(X, 3) - 1) - (h - pad_t), (h - pad_t) >= Dim(X, 3)),
        (h - pad_t, True)
      ),
      Piecewise(
        (-1 * (w - pad_l), (w - pad_l) < 0),
        (2 * (Dim(X, 4) - 1) - (w - pad_l), (w - pad_l) >= Dim(X, 4)),
        (w - pad_l, True)
      )
    ]
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b", "pad_f", "pad_bk" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_f + pad_bk
    - Dim(X, 3) + pad_t + pad_b
    - Dim(X, 4) + pad_l + pad_r
  mechanisms:
    - description: "Padding size constraint"
      check: >
        (pad_l < Dim(X, 4)) & (pad_r < Dim(X, 4)) &
        (pad_t < Dim(X, 3)) & (pad_b < Dim(X, 3)) &
        (pad_f < Dim(X, 2)) & (pad_bk < Dim(X, 2))

ReplicationPad1d:
  description: "Pads the input tensor using replication."
  definition_type: operator
  math_symbol: >
    X[n, c, 
      Piecewise(
        (0, (w - pad_l) < 0),
        (Dim(X, 2) - 1, (w - pad_l) >= Dim(X, 2)),
        (w - pad_l, True)
      )
    ]
  param_map:
    padding: [ "pad_l", "pad_r" ]
  output_shape:
    - Dim(X, 0)
    - Dim(X, 1)
    - Dim(X, 2) + pad_l + pad_r
  mechanisms:
    - description: "Output shape definition"
      check: "Dim(Y, 2) == Dim(X, 2) + pad_l + pad_r"
    - description: "Output dimension constraint"
      check: "Dim(X, 2) + pad_l + pad_r > 0"

ReplicationPad2d:
  description: "Pads the input tensor using replication."
  definition_type: operator
  math_symbol: >
    X[n, c,
      Piecewise(
        (0, (h - pad_t) < 0),
        (Dim(X, 2) - 1, (h - pad_t) >= Dim(X, 2)),
        (h - pad_t, True)
      ),
      Piecewise(
        (0, (w - pad_l) < 0),
        (Dim(X, 3) - 1, (w - pad_l) >= Dim(X, 3)),
        (w - pad_l, True)
      )
    ]
  param_map:
    padding: [ "pad_l", "pad_r", "pad_t", "pad_b" ]
  output_shape:
