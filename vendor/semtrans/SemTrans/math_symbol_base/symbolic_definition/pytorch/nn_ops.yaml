      check: "Dim(Y, 2) == Dim(X, 2) + pad_l + pad_r"
    - description: "Non-negative padding constraint"
      check: "(pad_l >= 0) & (pad_r >= 0)"

ConstantPad2d:
  description: "Pads the input tensor boundaries with a constant value."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (pad_val, (h - pad_t) < 0),
      (pad_val, (h - pad_t) >= Dim(X, 2)),
      (pad_val, (w - pad_l) < 0),
      (pad_val, (w - pad_l) >= Dim(X, 3)),
