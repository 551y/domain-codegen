        (Dim(Y, 2) == Dim(X, 2) + pad_t + pad_b) &
        (Dim(Y, 3) == Dim(X, 3) + pad_l + pad_r)
    - description: "Non-negative padding constraint"
      check: >
        (pad_l >= 0) & (pad_r >= 0) &
        (pad_t >= 0) & (pad_b >= 0)

ZeroPad3d:
  description: "Pads the input tensor boundaries with zero."
  definition_type: operator
  math_symbol: >
    Piecewise(
      (0, (d - pad_f) < 0),
      (0, (d - pad_f) >= Dim(X, 2)),
      (0, (h - pad_t) < 0),
      (0, (h - pad_t) >= Dim(X, 3)),
      (0, (w - pad_l) < 0),
      (0, (w - pad_l) >= Dim(X, 4)),
