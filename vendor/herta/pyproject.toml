[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herta"
version = "0.1.0"
description = "基于 RAG 的协议生成系统"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Herta Team"}
]
keywords = ["rag", "protocol", "generator", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.7.4",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "zai-sdk>=0.2.0",
    "httpx>=0.27.0",
    # Web API 依赖
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    # Compare 模块依赖
    "tree-sitter>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "apted>=1.0.3",
    "rapidfuzz>=3.0.0",
    "scipy>=1.12.0",
]

[project.scripts]
herta = "herta.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
